/* ---------- sortie (compact order card) ----------
   Modeled on the old postcard order form: one card, one screen. Everything you need to *read* is in the paper on the left;
   here you only pick: area / ship / equipment (4 slots) / stance / wingman / promotion, and see the merit ledger. */
function renderSortie(box){
  const c = ep.content;
  const shipOf = code => c.ships.find(s=>s.code===code);
  const eqOf = code => (c.equipment||[]).find(q=>q.code===code);
  const optsOf = s => s?.options || null;
  const fresh = !me;   // no captain yet: this sheet also registers one
  const M = me || { name:'', rank:'少尉', merit:20, stats:{...(newcomerDraft?.stats || {attack:5,helm:5,command:5,engineering:5,intuition:5})},
                    ship_code:null, equipment:[], joined_no: ep.no, state:'active', repair_due:0, injured:false };
  const o = myOrder || (fresh && newcomerDraft ? { area: newcomerDraft.order.area, ship_code: newcomerDraft.order.ship, equipment: newcomerDraft.order.eq, stance: newcomerDraft.order.stance } : null);
  let authMode = 'signup';
  const initEq = (o?.equipment || M.equipment || []).slice(0,4);
  const state = { area: o?.area || '', ship: o?.ship_code || M.ship_code || '', eq: [0,1,2,3].map(i=>initEq[i]||''), pick: new Set(initEq),
    promote: !!o?.promote, up: {...(o?.stat_up||{})}, stance: o?.stance || '標準', wing: o?.wingman_id ? String(o.wingman_id) : '' };
  const missing = M.state === 'missing';
  const canPromote = ep.no > (M.joined_no ?? 1);
  if (!canPromote){ state.promote = false; state.up = {}; }
  const nextRank = RANKS[RANKS.indexOf(M.rank)+1];

  box.innerHTML = `<form class="ocard" id="sortie" novalidate aria-labelledby="oTitle">
    <div class="otitle"><h2 id="oTitle">出撃指示書</h2><span>第${ep.no}話「${esc(ep.title)}」　締切 ${esc(dlText())}</span></div>
    <div class="ohead">
      ${fresh ? `<div class="newcomer"><p class="nc-lead">はじめての方へ：艦長の名前と能力値を決めて、出撃する宙域と艦を選ぶだけ。最後に「出撃する」を押すと、艦長の登録と出撃が同時に済みます。</p>
        <div class="field"><label for="ncName">艦長の名前<small>全角カタカナ10文字まで。「・」「＝」も使えます</small></label><input type="text" id="ncName" maxlength="10" placeholder="例）アルト＝カミナギ" value="${esc(newcomerDraft?.name||'')}"></div>
        <div class="field"><span class="lbl">性別</span><div class="choices two" style="grid-template-columns:repeat(3,1fr)">${['男','女','その他'].map((g,i)=>`<label class="choice"><input type="radio" name="ncGender" value="${g}" ${(newcomerDraft?.gender||'男')===g?'checked':''}><span class="t">${g}</span></label>`).join('')}</div></div>
        <dl class="oname"><div><dt>階級</dt><dd>少尉（最初の階級）</dd></div><div><dt>功績P</dt><dd>20（艦を選ぶのに使います）</dd></div></dl></div>`
      : `<dl class="oname"><div><dt>名前</dt><dd>${esc(M.name)}</dd></div><div><dt>階級</dt><dd>${esc(M.rank)}</dd></div></dl>`}
      ${M.injured?'<div class="oinj">負傷中：今回の戦闘では全能力値が1下がります</div>':''}
    </div>
    <div class="ostats" id="sStats"></div>
    <div class="opromo">
      ${fresh ? `<span class="ochk"><input type="checkbox" id="sPromote" hidden disabled>能力値を割り振る（合計25・各0〜10）</span>` : `<label class="ochk"><input type="checkbox" id="sPromote" ${!canPromote||!nextRank?'disabled':''}>`}${fresh?'':` ${nextRank?`昇進する　${esc(M.rank)}→${esc(nextRank)}（${RANK_COST[M.rank]}P）`:'これ以上昇進できません'}</label>`}
      <span class="ohint" id="sUpHint" style="margin:0"></span>
    </div>
    ${missing?'<p class="msg err" style="margin:6px 0 0">前回消息不明のため、今回は出撃できません。</p>':''}
    ${o?`<div class="oflag">第${ep.no}話の出撃指示を受付済み。締切までは何度でも出し直せます。</div>`:''}

    <div class="orow"><span class="olbl">部隊</span><div class="seg4" id="sArea" role="radiogroup" aria-label="出撃エリア"></div></div>
    <div class="ohint" id="sAreaHint"></div>

    <div class="orow"><label class="olbl" for="sShip">艦艇</label><select id="sShip"></select></div>
    <div class="orow top"><span class="olbl" id="sEqL">装備<small>4つまで</small></span><div id="sEq"></div></div>

    <div class="orow"><span class="olbl">方針</span><div class="seg3" id="sStance" role="radiogroup" aria-label="作戦方針"></div></div>

    <div class="ledger" id="sCost" aria-live="polite"></div>
    ${fresh && !session ? `<div class="ncauth"><div class="seg" role="group" aria-label="新規登録かログインか"><button type="button" data-m="signup" aria-pressed="true">はじめて（新規登録）</button><button type="button" data-m="login" aria-pressed="false">アカウントがある</button></div>
      <div class="field"><label for="ncEmail">メールアドレス<small>結果（返信ハガキ）を読むときに使います</small></label><input type="email" id="ncEmail" autocomplete="email"></div>
      <div class="field"><label for="ncPass">パスワード<small id="ncPassHint">6文字以上</small></label><input type="password" id="ncPass" autocomplete="new-password"></div>
      <div class="field" id="ncPass2W"><label for="ncPass2">パスワード（確認）</label><input type="password" id="ncPass2" autocomplete="new-password"></div></div>` : ''}
    <button class="btn full" id="sBtn" ${missing?'disabled':''}>${fresh ? (session ? '出撃する（艦長を登録）' : '出撃する（新規登録）') : o?'出撃指示を出し直す':'出撃する'}</button>
    <div class="msg" id="sMsg" role="status"></div>
  </form>${fresh ? '' : lastResultCard()}`;

  $('#sPromote').checked = state.promote;

  const rankIdx = () => RANKS.indexOf(M.rank) + (state.promote?1:0);
  const statsAfter = () => { const s={...M.stats}; if(state.promote) for(const k in state.up) s[k]+=state.up[k]; return s; };
  const shipNg = s => { const r=s.requires||{}; if(r.rank && rankIdx() < RANKS.indexOf(r.rank)) return `${r.rank}以上`; if(r.stats){ const sa=statsAfter(); for(const k in r.stats) if((sa[k]||0) < r.stats[k]) return `${SNAME[k]}${r.stats[k]}以上`; } return ''; };
  const shipCost = s => M.ship_code===s.code ? (M.repair_due||0) : (s.free_from && M.ship_code===s.free_from ? 0 : s.cost);
  // trade-in: switching ships returns half the old ship's listed price (rounded down), minus unpaid repairs; upgrades (改修) return nothing
  const refund = () => {
    const s = shipOf(state.ship); if (!s || !M.ship_code || s.code === M.ship_code) return 0;
    if (s.free_from && M.ship_code === s.free_from) return 0;
    const old = shipOf(M.ship_code); return old ? Math.max(0, Math.floor(old.cost / 2) - (M.repair_due || 0)) : 0;
  };
  const gross = () => {
    let cost = state.promote ? (RANK_COST[M.rank]||0) : 0;
    const s = shipOf(state.ship); if (s) cost += shipCost(s);
    if (!optsOf(shipOf(state.ship))) for (const code of state.eq) if (code && !M.equipment.includes(code)) cost += eqOf(code)?.cost || 0;
    return cost;
  };
  const calc = () => gross() - refund();
  const draw = () => {
    $('#sArea').innerHTML = c.areas.map(a=>`<button type="button" role="radio" aria-checked="${state.area===a.code}" class="segb d-${esc(a.danger)}" data-v="${a.code}" title="${esc(a.name)}"><b>${esc(a.code)}</b><span>${esc(a.name)}</span></button>`).join('');
    const ar = c.areas.find(a=>a.code===state.area);
    $('#sAreaHint').innerHTML = ar ? `危険度 <b class="dl d-${esc(ar.danger)}">${esc(ar.danger)}</b>　推奨 ${ar.rec.map(k=>SNAME[k]).join('・')}　有効 ${ar.eq.join('・')}` : '部隊を選ぶと、その宙域の要点がここに出ます';
    $('#sShip').innerHTML = `<option value="">選んでください</option>` + c.ships.map(s=>{ const ng=shipNg(s); const owned=M.ship_code===s.code; const free=s.free_from && M.ship_code===s.free_from;
      return `<option value="${s.code}" ${ng?'disabled':''}>${esc(s.name)}　攻${s.atk}防${s.def}機${s.mob}　${owned?(M.repair_due?`乗艦中・修理${M.repair_due}P`:'乗艦中'):free?'無料改修':s.cost+'P'}${ng?`（${ng}）`:''}</option>`; }).join('');
    $('#sShip').value = state.ship && !shipNg(shipOf(state.ship)||{}) ? state.ship : (state.ship='', '');
    const so = optsOf(shipOf(state.ship)), ar2 = c.areas.find(a=>a.code===state.area);
    if (so){
      const max = shipOf(state.ship).option_max || 2;
      for (const k of [...state.pick]) if (!so.some(q=>q.code===k)) state.pick.delete(k);
      $('#sEqL').innerHTML = `装備<small>${max}つ選ぶ</small>`;
      $('#sEq').className = 'optpick';
      $('#sEq').innerHTML = so.map((q,i)=>{ const on = state.pick.has(q.code), fit = ar2 && ar2.eq.includes(q.type);
        return `<button type="button" class="optb${fit?' fit':''}" aria-pressed="${on}" data-k="${q.code}" ${!on && state.pick.size>=max?'disabled':''} title="${esc(q.desc||'')}"><b>${'ABCDE'[i]}</b>${esc(q.name)}<i>${esc(q.type)}${fit?'・有効':''}</i></button>`; }).join('');
    } else if (!state.ship){
      $('#sEqL').innerHTML = '装備'; $('#sEq').className = ''; $('#sEq').innerHTML = '<span class="ohint" style="margin:0">艦艇を選ぶと、その艦の選択装備が出ます</span>';
    } else {
    $('#sEqL').innerHTML = '装備<small>4つまで</small>'; $('#sEq').className = 'eq4';
    $('#sEq').innerHTML = state.eq.map((v,i)=>`<select data-i="${i}" aria-label="装備${i+1}"><option value="">― なし ―</option>${c.equipment.map(q=>{ const taken = state.eq.includes(q.code) && v!==q.code;
      return `<option value="${q.code}" ${taken?'disabled':''} ${v===q.code?'selected':''}>${esc(q.name)}［${esc(q.type)}］${M.equipment.includes(q.code)?'所持':q.cost+'P'}</option>`; }).join('')}</select>`).join('');
    }
    $('#sStance').innerHTML = STANCES.map(([k,d])=>`<button type="button" role="radio" aria-checked="${state.stance===k}" class="segb" data-v="${k}" title="${esc(d)}"><b>${k}</b></button>`).join('');
    const upTotal = Object.values(state.up).reduce((a,b)=>a+b,0);
    // stats are always shown; the +/- only light up while 「昇進する」 is checked
    const on = state.promote;
    $('#sStats').className = 'ostats' + (on || fresh ? ' on' : '');
    if (fresh){
      const tot = Object.values(M.stats).reduce((a,b)=>a+b,0);
      $('#sStats').innerHTML = STATS.map(([k,n])=>`<div class="sc"><span class="sn">${n}</span><div class="sv"><button type="button" data-k="${k}" data-d="-1" aria-label="${n}を下げる" ${M.stats[k]<=0?'disabled':''}>−</button><b>${M.stats[k]}</b><button type="button" data-k="${k}" data-d="1" aria-label="${n}を上げる" ${M.stats[k]>=10||tot>=25?'disabled':''}>＋</button></div></div>`).join('');
      $('#sUpHint').textContent = tot===25 ? '合計25：割り振り完了' : `あと ${25-tot} 点割り振れます`;
      $('#sUpHint').classList.toggle('warn', tot!==25);
      const g = gross(); $('#sCost').innerHTML = `<span>所持 <b>${M.merit}</b></span><span>−</span><span>消費 <b>${g}</b></span><span>＝</span><span>残り <b class="${M.merit-g<0?'over':'ok'}">${M.merit-g}</b> P</span>`;
      bind(); return;
    }
    $('#sStats').innerHTML = STATS.map(([k,n])=>{ const v = M.stats[k]+(state.up[k]||0);
      return `<div class="sc${state.up[k]?' raised':''}"><span class="sn">${n}</span><div class="sv"><button type="button" data-k="${k}" data-d="-1" aria-label="${n}を下げる" ${!on||!(state.up[k]>0)?'disabled':''}>−</button><b>${v}</b><button type="button" data-k="${k}" data-d="1" aria-label="${n}を上げる" ${!on||upTotal>=2||v>=20?'disabled':''}>＋</button></div></div>`; }).join('');
    // promotion is only offered while the merit left (after ship / equipment) still covers it
    const rankCost = RANK_COST[M.rank] || 0, roomForPromo = M.merit - (calc() - (on ? rankCost : 0));
    const short = !on && nextRank && canPromote && roomForPromo < rankCost;
    $('#sPromote').disabled = !canPromote || !nextRank || short;
    $('#sPromote').closest('.ochk').classList.toggle('off', $('#sPromote').disabled);
    $('#sUpHint').textContent = !canPromote ? '参加した回の次の回から昇進できます'
      : short ? `功績Pが足りません（あと ${rankCost - roomForPromo}P）`
      : on ? `あと ${2-upTotal} 上げられます` : '昇進すると能力値を合計2上げられます';
    $('#sUpHint').classList.toggle('warn', !!short);
    const g = gross(), rf = refund(), left = M.merit - g + rf;
    $('#sCost').innerHTML = `<span>所持 <b>${M.merit}</b></span><span>−</span><span>消費 <b>${g}</b></span>${rf?`<span>＋</span><span title="${esc(shipOf(M.ship_code)?.name||'')}を下取り">下取り <b class="ok">${rf}</b></span>`:''}<span>＝</span><span>残り <b class="${left<0?'over':'ok'}">${left}</b> P</span>`;
    bind();
  };
  const bind = () => {
    $('#sArea').querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.area=b.dataset.v; draw(); });
    $('#sStance').querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.stance=b.dataset.v; draw(); });
    $('#sShip').onchange = e => { state.ship = e.target.value; draw(); };
    $('#sEq').querySelectorAll('select').forEach(s=>s.onchange=()=>{ state.eq[+s.dataset.i] = s.value; draw(); });
    $('#sEq').querySelectorAll('.optb').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; state.pick.has(k)?state.pick.delete(k):state.pick.add(k); draw(); });
    $('#sStats').querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=b.dataset.k;
      if (fresh){ M.stats[k] = Math.max(0, Math.min(10, M.stats[k] + (+b.dataset.d))); draw(); return; }
      state.up[k]=(state.up[k]||0)+(+b.dataset.d); if(!state.up[k]) delete state.up[k]; draw(); });
  };
  $('#sPromote').onchange = e => { state.promote = e.target.checked; if(!state.promote) state.up = {}; draw(); };
  if (fresh && !session) box.querySelectorAll('.ncauth .seg button').forEach(bt=>bt.onclick=()=>{ authMode = bt.dataset.m;
    box.querySelectorAll('.ncauth .seg button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.m===authMode));
    $('#ncPass2W').hidden = authMode!=='signup'; $('#ncPassHint').textContent = authMode==='signup'?'6文字以上':'';
    $('#ncPass').autocomplete = authMode==='signup'?'new-password':'current-password';
    $('#sBtn').textContent = authMode==='signup' ? '出撃する（新規登録）' : '出撃する（ログイン）'; });
  draw();
  if (fresh && newcomerErr){ const m = $('#sMsg'); m.className='msg err'; m.textContent = newcomerErr; newcomerErr = ''; }

  $('#sortie').onsubmit = async ev => {
    ev.preventDefault();
    const msg = $('#sMsg'); msg.className = 'msg err';
    if (!state.area){ msg.textContent='部隊（出撃エリア）を選んでください。'; return; }
    if (!state.ship){ msg.textContent='艦艇を選んでください。'; return; }
    if (state.promote && Object.values(state.up).reduce((a,b)=>a+b,0) !== 2){ msg.textContent='昇進するときは能力値を合計2上げてください。'; return; }
    if (calc() > M.merit){ msg.textContent='功績Pが足りません。艦や装備を見直してください。'; return; }
    if (fresh){
      const name = $('#ncName').value.trim(), tot = Object.values(M.stats).reduce((a,b)=>a+b,0);
      if (!/^[ァ-ヶー・＝]{1,10}$/.test(name)){ msg.textContent='艦長の名前を全角カタカナ10文字以内で入れてください。'; $('#ncName').focus(); return; }
      if (roster.some(r=>r.name===name)){ msg.textContent='その名前はすでに使われています。別の名前にしてください。'; $('#ncName').focus(); return; }
      if (tot !== 25){ msg.textContent='能力値の合計を25にしてください。'; return; }
      const draft = { name, gender: document.querySelector('input[name=ncGender]:checked').value, stats: {...M.stats},
        order: { area: state.area, ship: state.ship, eq: optsOf(shipOf(state.ship)) ? [...state.pick] : [...new Set(state.eq.filter(Boolean))], stance: state.stance } };
      $('#sBtn').disabled = true;
      if (!session){
        const email = $('#ncEmail').value.trim(), pass = $('#ncPass').value;
        if (!email || !pass){ msg.textContent='登録用のメールアドレスとパスワードを入れてください。'; $('#sBtn').disabled=false; $('#ncEmail').focus(); return; }
        if (authMode==='signup'){
          if (pass.length < 6){ msg.textContent='パスワードは6文字以上にしてください。'; $('#sBtn').disabled=false; return; }
          if (pass !== $('#ncPass2').value){ msg.textContent='確認用のパスワードが一致しません。'; $('#sBtn').disabled=false; return; }
        }
        msg.className='msg'; msg.textContent = authMode==='signup' ? '登録しています…' : 'ログインしています…';
        const { data, error } = authMode==='signup' ? await sb.auth.signUp({ email, password: pass }) : await sb.auth.signInWithPassword({ email, password: pass });
        if (error){ msg.className='msg err'; msg.textContent = AUTH_JA(error.message); $('#sBtn').disabled=false; return; }
        if (!data.session){ savePending(draft); msg.className='msg ok';
          msg.textContent = '確認メールを送りました。メール内のリンクを開いてログインすると、この出撃指示書がそのまま届きます（このブラウザに保存してあります）。'; $('#sBtn').disabled=false; return; }
        session = data.session;
        if (authMode==='login'){   // an account that already has a captain keeps it
          const ex = await sb.from('characters').select('id').eq('season_id', SEASON).eq('user_id', session.user.id).maybeSingle();
          if (ex.data){ await enterApp(); const m2 = $('#sMsg'); if (m2){ m2.className='msg'; m2.textContent='ログインしました。登録済みの艦長で出撃指示を出してください。'; } return; }
        }
      }
      msg.className='msg'; msg.textContent = '艦長を登録して、出撃指示を送っています…';
      const err = await submitNewcomer(draft);
      if (err){ newcomerDraft = draft; newcomerErr = err; await enterApp(); return; }
      newcomerDraft = null; pendingDone = true; await enterApp(); return;
    }
    $('#sBtn').disabled = true; msg.className='msg'; msg.textContent = '送信しています…';
    const eq = optsOf(shipOf(state.ship)) ? [...state.pick] : [...new Set(state.eq.filter(Boolean))];
    const { data, error } = await sb.rpc('submit_order', { p_area: state.area, p_ship: state.ship, p_equipment: eq, p_wingman: null, p_promote: state.promote, p_stat_up: state.promote ? state.up : {}, p_free_action: '', p_stance: state.stance });
    if (error){ msg.className='msg err'; msg.textContent = error.message; $('#sBtn').disabled=false; return; }
    await loadAll();
    const m = $('#sMsg'); if (m){ m.className='msg ok'; m.textContent = `受け付けました。${data.refund?`下取り ${data.refund}P を含めて`:''}差し引き ${data.cost}P、残り ${data.merit_left}P。締切までは何度でも出し直せます。`; }
  };
}

boot();
</script>
</body>
</html>
