<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星海戦記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: one dark column like a fleet briefing sheet; the paper (story, areas, ships) on top, your sortie form below */
:root{
  color-scheme: dark;
  --bg:#0d1015; --panel:#141921; --panel2:#1a212b; --ink:#e7ebf0; --sub:#97a2b1; --rule:#2a3341;
  --glow:#9fd8ea; --warn:#e6a85c; --bad:#ec7a68; --good:#86d6a6;
  --f-head:"Noto Serif JP","Hiragino Mincho ProN",serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.8;padding-inline:16px}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 80px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
a{color:var(--glow)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.mast{border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:22px}
.mast .series{font-family:var(--f-head);font-weight:900;font-size:clamp(34px,9vw,52px);letter-spacing:.12em;line-height:1.1}
.mast .ep{font-family:var(--f-head);font-weight:600;font-size:clamp(18px,4.4vw,24px);margin-top:6px}
.mast .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--sub);font-size:13px;margin-top:8px}
.mast .meta b{color:var(--ink);font-weight:700}
section{margin-top:30px}
.sh{font-size:13px;letter-spacing:.2em;color:var(--glow);font-family:var(--f-body);font-weight:700;margin-bottom:10px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:18px}
.intro{font-family:var(--f-head);font-size:16px;line-height:2}
.brief{display:grid;grid-template-columns:96px 1fr;gap:14px;margin-top:16px;font-size:14px;color:var(--sub);align-items:start}
.brief.cmd{border-left:3px solid var(--accent,#c9a227);padding-left:12px}
.brief .ctitle{display:block;font-size:12px;letter-spacing:.08em;color:var(--sub)}
.brief .cwords{margin:4px 0 0;color:var(--ink);font-family:var(--f-head);line-height:1.9}
.rpimg{margin:12px 0 4px}
.rpimg img{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--rule)}
.ednote{margin-top:22px;border:1px solid var(--rule);border-left:4px solid var(--accent,#c9a227);border-radius:6px;padding:14px 16px;background:var(--panel,transparent)}
.ednote .sh{margin:0 0 8px}
.ednote p{margin:8px 0 0;font-size:14.5px;line-height:1.85}
.ednote p:first-of-type{margin-top:0}
.rpimg figcaption{font-size:12px;color:var(--sub);margin-top:6px;text-align:center}
.story .storybox{background:var(--panel,rgba(255,255,255,.03));border:1px solid var(--rule);border-radius:8px;padding:18px 20px;font-family:var(--f-head);line-height:2.1;font-size:15px}
.story .storybox::after{content:"";display:block;clear:both}
.story h3{margin:0 0 8px;font-size:19px}
.story p{margin:0 0 .9em;text-indent:1em}
.story p.q{text-indent:0}
.story .storyimg{float:right;width:120px;height:150px;object-fit:cover;object-position:50% 10%;border-radius:6px;border:1px solid var(--rule);margin:0 0 10px 14px}
@media(max-width:480px){.story .storyimg{width:84px;height:105px}}
.brief .face{width:96px;height:120px;border-radius:6px;border:1px solid var(--rule);object-fit:cover;object-position:50% 8%;background:#f5f5f3}
/* Illustrations from the original 星海戦記 (2025). Printed-paper tiles: light ground, thin rule */
.mast{display:flex;gap:16px;align-items:center}
.mast .logo{width:86px;height:86px;border-radius:6px;border:1px solid var(--rule);flex:none;object-fit:cover}
.hero{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);margin-bottom:18px}
.shipimg{display:block;width:120px;height:62px;object-fit:contain;background:#f5f6f8;border-radius:4px;padding:3px;margin-bottom:6px}
.choice .shipimg{width:72px;height:40px;margin:0;flex:none}
.enemy{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:start}
.enemy img{width:132px;height:80px;object-fit:contain;background:#fefefe;border-radius:4px;padding:4px}
@media(max-width:480px){.enemy{grid-template-columns:96px 1fr}.enemy img{width:96px;height:62px}.brief{grid-template-columns:72px 1fr}.brief .face{width:72px;height:92px}.mast .logo{width:64px;height:64px}}
.map{position:relative;margin:6px 0 0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:#000}
.map img{display:block;width:100%;height:auto}
.map .pin{position:absolute;transform:translateY(-50%);max-width:47%;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:99px;background:rgba(8,10,14,.78);border:1px solid rgba(255,255,255,.28);font-size:13px;color:#fff;line-height:1.35}
.map .pin b{flex:none}
.map .pin b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--glow);color:#0d1015;font-family:var(--f-head);font-size:15px}
.map .pin.d-最高 b{background:var(--bad)}.map .pin.d-高 b{background:var(--warn)}.map .pin.d-低 b{background:var(--good)}
.map figcaption{position:absolute;right:10px;bottom:6px;font-size:12px;letter-spacing:.3em;color:rgba(255,255,255,.7)}
@media(max-width:480px){.map .pin{font-size:11px;padding:2px 7px 2px 3px;gap:4px}.map .pin b{width:19px;height:19px;font-size:12px}}
.areas{display:grid;gap:10px}
.area{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--panel)}
.area h3{font-size:17px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.area h3 .code{font-family:var(--f-head);font-weight:900;color:var(--glow);font-size:20px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px}
.tag{border:1px solid var(--rule);border-radius:3px;padding:0 7px;color:var(--sub)}
.tag.d-低{color:var(--good);border-color:currentColor}.tag.d-中{color:var(--glow);border-color:currentColor}
.tag.d-高{color:var(--warn);border-color:currentColor}.tag.d-最高{color:var(--bad);border-color:currentColor}
.area p{margin:6px 0 0;font-size:14px}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;color:var(--sub);font-weight:700;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.enemy{border-left:3px solid var(--rule);padding:4px 0 4px 12px;margin-top:12px}
.enemy b{font-family:var(--f-head)}
.enemy .hint{color:var(--glow);font-size:13.5px}
/* forms */
.card{background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:18px}
.field{margin-top:16px}
.field>label,.field>.lbl{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
.field small{display:block;color:var(--sub);font-weight:400;font-size:12px}
input[type=text],select,textarea{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:9px 10px}
textarea{min-height:84px;resize:vertical}
.stat{display:grid;grid-template-columns:4.5em 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.stat .bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--glow)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border:1px solid var(--rule);background:var(--bg);border-radius:4px;cursor:pointer}
.step button:disabled{opacity:.3;cursor:default}
.step output{width:2em;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.total{display:flex;justify-content:space-between;margin-top:8px;font-size:13.5px;color:var(--sub)}
.total b{font-size:18px;color:var(--warn)}.total b.ok{color:var(--good)}
.choices{display:grid;gap:8px}
@media(min-width:620px){.choices.two{grid-template-columns:1fr 1fr}}
@media(min-width:620px){.choices.three{grid-template-columns:repeat(3,1fr)}}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.choice:has(input:checked){border-color:var(--glow);box-shadow:inset 0 0 0 1px var(--glow)}
.choice:has(input:disabled){opacity:.45;cursor:not-allowed}
.choice input{margin-top:5px;accent-color:var(--glow)}
.choice .t{font-weight:700;display:block}
.choice .d{font-size:12.5px;color:var(--sub);display:block;line-height:1.6}
.choice .c{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--glow);white-space:nowrap;font-weight:700}
.cost{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:18px;padding:12px 14px;border:1px solid var(--rule);border-radius:6px;font-size:14px}
.cost b{font-size:18px}.cost .over{color:var(--bad)}
.btn{display:inline-block;border:0;border-radius:6px;padding:12px 22px;font-weight:700;cursor:pointer;background:var(--glow);color:#0d1015}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%;margin-top:16px;font-size:16px}
.btn.ghost{background:transparent;color:var(--glow);border:1px solid var(--glow)}
.msg{margin-top:12px;font-size:14px;min-height:1.5em}
.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
.me{display:grid;gap:4px 16px;grid-template-columns:auto 1fr;font-size:14px}
.me dt{color:var(--sub)}.me dd{margin:0}
.statline{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--sub)}
.statline b{color:var(--ink)}
.order-now{border-left:3px solid var(--good);padding:6px 0 6px 12px;margin-top:14px;font-size:14px}
.note{color:var(--sub);font-size:12.5px;margin-top:10px}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:40px}
.loading{color:var(--sub)}
/* gate + app shell */
.gate{max-width:440px;margin:0 auto}
.gate .hero{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.gate .card{border-top-left-radius:0;border-top-right-radius:0}
.gate .title{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.gate .title .series{font-family:var(--f-head);font-weight:900;font-size:34px;letter-spacing:.12em;line-height:1.1}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-top:4px}
.seg button{background:transparent;border:0;padding:9px;cursor:pointer;color:var(--sub);font-weight:700}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--glow)}
input[type=email],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:9px 10px}
.bar{display:flex;gap:12px;align-items:center;padding-bottom:12px}
.bar .logo{width:48px;height:48px;border-radius:6px;border:1px solid var(--rule);object-fit:cover;flex:none}
.bar .who{flex:1;min-width:0}
.bar .series{font-family:var(--f-head);font-weight:900;font-size:22px;letter-spacing:.12em;line-height:1.2}
.bar .meta{color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .meta b{color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-bottom:1px solid var(--rule);margin:0 -16px 22px;padding:0 16px}
.tabs a{text-align:center;padding:11px 0 9px;color:var(--sub);text-decoration:none;font-weight:700;font-size:14px;border-bottom:2px solid transparent}
.tabs a[aria-current=page]{color:var(--glow);border-bottom-color:var(--glow)}
.ephead{margin-bottom:18px}
.ephead .ep{font-family:var(--f-head);font-weight:600;font-size:clamp(20px,4.6vw,26px)}
.ephead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--sub);font-size:13px;margin-top:4px}
.ephead .meta b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.kpi small{display:block;color:var(--sub);font-size:11.5px}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.todo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;border:1px solid currentColor}
.pill.ok{color:var(--good)}.pill.ng{color:var(--warn)}
.roster{columns:2 220px;column-gap:24px;font-size:14px;margin:0;padding:0;list-style:none}
.roster li{break-inside:avoid;padding:5px 0;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:8px}
.roster li.me b{color:var(--glow)}
.roster .r{color:var(--sub);font-size:12.5px}
/* results */
.headline{font-size:20px;text-wrap:wrap}
.gauge{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:14px;font-size:13px;color:var(--sub)}
.gbar{position:relative;height:10px;border-radius:5px;background:var(--rule)}
.gbar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--glow)}
.gbar b{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);opacity:.7}
.gv b{color:var(--ink);font-size:16px}
.res{margin-left:auto;font-size:12.5px;font-family:var(--f-body);font-weight:700;border:1px solid currentColor;border-radius:3px;padding:0 8px}
.r-大成功{color:var(--good)}.r-成功{color:var(--glow)}.r-苦戦{color:var(--warn)}.r-失敗{color:var(--bad)}
.out{font-weight:700}.o-good{color:var(--good)}.o-glow{color:var(--glow)}.o-warn{color:var(--warn)}.o-bad{color:var(--bad)}.o-sub{color:var(--sub)}
details summary{cursor:pointer;color:var(--glow);font-size:13.5px;margin-top:8px}
tr.mine td{background:rgba(159,216,234,.08)}
.mvpname{font-family:var(--f-head);font-size:19px}
.rank{margin:0;padding-left:1.8em;font-size:14px}
.rank li{padding:5px 0;border-bottom:1px solid var(--rule)}
.rank li .r{color:var(--sub);font-size:12.5px;margin-left:10px}
.rank li.mine b{color:var(--glow)}
.newtag{display:inline-block;font-size:11px;font-weight:700;color:#0d1015;background:var(--warn);border-radius:3px;padding:0 6px;vertical-align:2px}

/* sortie split view */
.refpane{display:none}
.refbar{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.refbar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--glow);color:var(--glow)}
.refprev{margin-top:30px}.refprev>summary{font-size:14px}
.fsh{margin-top:28px}
.newcomer{border:1px dashed var(--rule);border-radius:8px;padding:12px 14px;margin-bottom:6px}
.newcomer .nc-lead{margin:0 0 10px;font-size:13.5px;color:var(--ink);line-height:1.8}
.newcomer .field{margin-bottom:10px}
.ncauth{border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
.ncauth .field{margin:10px 0 0}
#formAnchor{scroll-margin-top:56px}
@media(min-width:1100px){.fsh{display:none}}
.refbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:99px;padding:12px 20px;font-weight:700;background:var(--warn);color:#0d1015;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer}
.sheet{position:fixed;inset:auto 0 0 0;margin:0;width:100%;max-width:100%;height:88vh;max-height:88vh;padding:0 16px;border:1px solid var(--rule);border-bottom:0;border-radius:14px 14px 0 0;background:var(--bg);color:var(--ink);display:none;flex-direction:column}
.sheet[open]{display:flex;animation:sheetup .22s ease-out}
.sheet::backdrop{background:rgba(0,0,0,.6)}
@keyframes sheetup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheethead{flex:none;border-bottom:1px solid var(--rule)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:8px auto 4px}
.sheetrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .refscroll{flex:1;overflow-y:auto;padding:14px 0 40px;overscroll-behavior:contain}
body.sheet-open{overflow:hidden}
@media(min-width:1100px){
  body.split-on .wrap{max-width:1280px}
  body.split-on .tabs{margin-inline:0}
  .split{display:grid;grid-template-columns:minmax(0,2fr) minmax(360px,1fr);gap:24px;align-items:start}
  body.split-on .ephead{margin-bottom:12px}
  .formpane{position:sticky;top:48px}
  .refpane{display:block;position:sticky;top:48px;height:calc(100vh - 64px);border:1px solid var(--rule);border-radius:8px;background:var(--panel);padding:0 14px;overflow:hidden}
  .refpane .refbar{border-bottom:1px solid var(--rule);position:relative}
  .refpane .refscroll{height:calc(100% - 46px);overflow-y:auto;padding:14px 2px 40px;overscroll-behavior:contain}
  .refpane .refscroll .panel{background:var(--panel2)}
  .formpane{min-width:0}
  .refbtn{display:none}
}

/* compact order card (postcard-style) */
.ocard{background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.oname{font-family:var(--f-head);font-weight:900;font-size:19px;line-height:1.3}
.ohead .statline{font-size:12px}
.ohead .pill{white-space:nowrap;flex:none}
.oflag{margin-top:8px;font-size:12.5px;color:var(--good)}
.orow{display:grid;grid-template-columns:3.6em 1fr;gap:8px;align-items:center;margin-top:10px}
.orow.top{align-items:start}
.olbl{font-weight:700;font-size:13px;color:var(--sub);line-height:1.3}
.olbl small{display:block;font-weight:400;font-size:10.5px}
.orow select{padding:7px 8px;font-size:13.5px}
.ohint{font-size:12px;color:var(--sub);margin:4px 0 0 calc(3.6em + 8px);line-height:1.5}
.ohint b{font-weight:700}
.dl.d-低{color:var(--good)}.dl.d-中{color:var(--glow)}.dl.d-高{color:var(--warn)}.dl.d-最高{color:var(--bad)}
.seg4,.seg3{display:grid;gap:6px}.seg4{grid-template-columns:repeat(4,1fr)}.seg3{grid-template-columns:repeat(3,1fr)}
.segb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:38px;padding:4px 4px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;line-height:1.25;min-width:0}
.segb b{font-family:var(--f-head);font-size:16px}
.segb span{font-size:10.5px;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segb[aria-checked=true]{border-color:var(--glow);box-shadow:inset 0 0 0 1px var(--glow);background:rgba(159,216,234,.08)}
.segb.d-最高 b{color:var(--bad)}.segb.d-高 b{color:var(--warn)}.segb.d-中 b{color:var(--glow)}.segb.d-低 b{color:var(--good)}
.seg3 .segb b{font-family:var(--f-body);font-size:14px}
.eq4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.eq4 select{padding:6px 6px;font-size:12.5px}
.ochk{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.ochk input{accent-color:var(--glow)}
.up5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.upc{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub)}
.upc .step button{width:24px;height:24px}
.upc .step output{width:1.6em;color:var(--ink)}

let SEASON = null, isAdmin = false; let sb, session = null, ep = null, last = null, epsAll = [], gauge = null, epNo = {}, me = null, myOrder = null, roster = [], myResults = [], lastOrder = null, myLetter = null, myOrders = {}, myLetters = {}, newcomerDraft = null, newcomerErr = '', pendingDone = false;
const AUTH_JA = m => /Invalid login credentials/i.test(m) ? 'メールアドレスかパスワードが違います。'
  : /already registered|already been registered/i.test(m) ? 'このメールアドレスは登録済みです。「ログイン」から入ってください。'
  : /Password should be at least/i.test(m) ? 'パスワードは6文字以上にしてください。'
  : /valid email|invalid format/i.test(m) ? 'メールアドレスの形が正しくありません。'

async function boot(){
  $('#boot').hidden = true;
  if (!window.supabase){ $('#gate').hidden=false; $('#gate').innerHTML = '<p class="msg err">接続用の部品を読み込めませんでした。通信状況を確認して、ページを再読み込みしてください。</p>'; return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  ({ data: { session } } = await sb.auth.getSession());
  await enterApp();   // guests too: the paper is public, sign-up happens at the 出撃 button
}

/* ---------- gate (login / sign-up) ---------- */
function renderGate(){
  $('#app').hidden = true; const g = $('#gate'); g.hidden = false;
  let mode = 'login';
  g.innerHTML = `<div class="gate">
    <div class="title"><img class="logo" src="${IMG.logo}" alt="" style="width:64px;height:64px;border-radius:6px;border:1px solid var(--rule)"><div><div class="series">星海戦記</div><div style="color:var(--sub);font-size:13px">読者参加型 宇宙艦隊戦記</div></div></div>
    <img class="hero" src="${IMG.hero}" alt="クジラ型艦と交戦する宙航軍の艦隊">
    <a class="gatelink" href="#guide">はじめての方へ：遊び方とゲームの流れ</a>
    <form class="card" id="authForm" novalidate>
      <div class="seg" role="group" aria-label="ログインか新規登録か"><button type="button" data-m="login" aria-pressed="true">ログイン</button><button type="button" data-m="signup" aria-pressed="false">新規登録</button></div>
      <div class="field"><label for="aEmail">メールアドレス</label><input type="email" id="aEmail" autocomplete="email" required></div>
      <div class="field"><label for="aPass">パスワード<small id="aPassHint"></small></label><input type="password" id="aPass" autocomplete="current-password" minlength="6" required></div>
      <div class="field" id="aPass2Wrap" hidden><label for="aPass2">パスワード（確認）</label><input type="password" id="aPass2" autocomplete="new-password"></div>
      <button class="btn full" id="aBtn" type="submit">ログイン</button>
      <div class="msg" id="aMsg" role="status"></div>
    </form></div>`;
  const setMode = m => { mode = m;
    g.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.m===m));
    $('#aPass2Wrap').hidden = m!=='signup'; $('#aBtn').textContent = m==='signup'?'登録して入隊する':'ログイン';
    $('#aPass').autocomplete = m==='signup'?'new-password':'current-password';
    $('#aPassHint').textContent = m==='signup'?'6文字以上':''; $('#aMsg').textContent=''; };
  g.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const msg = $('#aMsg'); msg.className = 'msg err';
    const email = $('#aEmail').value.trim(), pass = $('#aPass').value;
    if (!email || !pass){ msg.textContent = 'メールアドレスとパスワードを入れてください。'; return; }
    if (mode==='signup'){
      if (pass.length < 6){ msg.textContent = 'パスワードは6文字以上にしてください。'; return; }
      if (pass !== $('#aPass2').value){ msg.textContent = '確認用のパスワードが一致しません。'; return; }
    }
    $('#aBtn').disabled = true; msg.className='msg'; msg.textContent = mode==='signup'?'登録しています…':'ログインしています…';
    const { data, error } = mode==='signup' ? await sb.auth.signUp({ email, password: pass }) : await sb.auth.signInWithPassword({ email, password: pass });
    $('#aBtn').disabled = false;
    if (error){ msg.className='msg err'; msg.textContent = AUTH_JA(error.message); return; }
    if (!data.session){ msg.className='msg ok'; msg.textContent = '確認メールを送りました。メール内のリンクを開いてから、ログインしてください。'; setMode('login'); return; }
    session = data.session; await enterApp();
  };
}

/* ---------- app (after login) ---------- */
async function enterApp(){
  $('#gate').hidden = true; $('#gate').innerHTML = ''; $('#app').hidden = false;
  $('#logo').src = IMG.logo;
  const lb = $('#logout');
  if (session){ lb.textContent = 'ログアウト'; lb.onclick = async () => { await sb.auth.signOut(); session = null; me = null; isAdmin = false; loadAll.adminChecked = false;
      document.querySelector('#tabs a[data-v=admin]')?.remove(); history.replaceState(null, '', '#paper'); await enterApp(); }; }
  else { lb.textContent = 'ログイン'; lb.onclick = () => { location.hash = '#login'; }; }
  await loadAll();
}

// the season shown: the active one, else the most recent
async function ensureSeason(){
  if (SEASON) return SEASON;
  const a = await sb.from('seasons').select('id').eq('status','active').order('id',{ascending:false}).limit(1).maybeSingle();
  if (a.data) return (SEASON = a.data.id);
  const b = await sb.from('seasons').select('id').order('id',{ascending:false}).limit(1).maybeSingle();
  return (SEASON = b.data?.id ?? null);
}
async function loadAll(){
  await ensureSeason();
  const { data: e, error } = await sb.from('episodes').select('id,no,title,status,deadline,content').eq('season_id', SEASON).eq('status','open').order('no',{ascending:false}).limit(1).maybeSingle();
  if (error){ $('#view').innerHTML = `<p class="msg err">紙面を読み込めませんでした（${esc(error.message)}）。</p>`; return; }
  ep = e;
  const [lr, er] = await Promise.all([
    sb.from('episodes').select('id,no,title,status,content,report').eq('season_id', SEASON).eq('status','done').order('no',{ascending:false}).limit(1).maybeSingle(),
    sb.from('episodes').select('id,no,title,status,deadline,content,report').eq('season_id', SEASON).neq('status','draft').order('no')]);
  last = lr.data || null;
  epsAll = er.data || []; epNo = Object.fromEntries(epsAll.map(x=>[x.id,x.no]));
  const r = await sb.from('characters').select('id,name,rank,state').eq('season_id', SEASON).order('id');
  roster = r.data || [];
  me = null; myOrder = null; myResults = []; lastOrder = null; myLetter = null; myOrders = {}; myLetters = {};
  const m = session ? await sb.from('characters').select('*').eq('season_id', SEASON).eq('user_id', session.user.id).maybeSingle() : { data: null };
  me = m.data;
  if (!me && session && ep){ const pd = readPending(); if (pd){ clearPending(); const err = await submitNewcomer(pd);
    if (!err){ pendingDone = true; return loadAll(); } newcomerDraft = pd; newcomerErr = err; } }
  if (me){
    if (ep){ const o = await sb.from('orders').select('*').eq('episode_id', ep.id).eq('character_id', me.id).maybeSingle(); myOrder = o.data; }
    const rs = await sb.from('results').select('episode_id,area,ship_code,outcome,merit_gained,kills,highlight').eq('character_id', me.id).order('episode_id',{ascending:false});
    myResults = rs.data || [];
    // my own orders and letters for every finished issue (owner-only by RLS) → each back issue gets its own 返信ハガキ
    const doneIds = epsAll.filter(x=>x.status==='done').map(x=>x.id);
    if (doneIds.length){
      const [lo, lt] = await Promise.all([
        sb.from('orders').select('episode_id,area,ship_code,equipment,stance,promote').in('episode_id', doneIds).eq('character_id', me.id),
        sb.from('letters').select('episode_id,body,notices').in('episode_id', doneIds).eq('character_id', me.id)]);
      for (const o of [].concat(lo.data||[])) myOrders[o.episode_id] = o;
      for (const l of [].concat(lt.data||[])) myLetters[l.episode_id] = l;
    }
    lastOrder = last ? myOrders[last.id] || null : null; myLetter = last ? myLetters[last.id] || null : null;
  }
  if (session && !loadAll.adminChecked){ const ia = await sb.rpc('is_admin'); isAdmin = !!ia.data; loadAll.adminChecked = true;
    if (isAdmin && !document.querySelector('#tabs a[data-v=admin]')){ const t = document.createElement('a'); t.href = '#admin'; t.dataset.v = 'admin'; t.textContent = '編集部'; $('#tabs').appendChild(t); $('#tabs').classList.add('six'); } }
  renderWho(); route();
  if (pendingDone && me){ pendingDone = false; const m = $('#sMsg'); if (m){ m.className='msg ok'; m.textContent = `入隊おめでとうございます、${me.rank} ${me.name}。第${ep?.no}話の出撃指示を受け付けました。締切までは何度でも出し直せます。`; m.scrollIntoView({block:'center'}); } }
}

function renderWho(){
  $('#who').innerHTML = me ? `<b>${esc(me.rank)}　${esc(me.name)}</b>　功績P <b>${me.merit}</b>` : session ? esc(session.user.email || 'ログイン中') : 'ゲスト　紙面は誰でも読めます';

function dlText(){ return ep?.deadline ? new Date(ep.deadline).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}) : '未定'; }
function epHead(){

function mapSvg(areas, c = ep.content){

  const src = c.map_image, srcS = c.map_image_s || c.map_image;

  const pins = areas.filter(a=>pos[a.code]).map(a=>{ const [x,y]=pos[a.code];
    const side = pinSide(x);
    return `<div class="pin d-${esc(a.danger)}" style="${side};top:${y}%"><b>${esc(a.code)}</b><span>${esc(a.name)}</span></div>`; }).join('');

      : `<svg viewBox="0 0 1600 899" aria-hidden="true" style="display:block;width:100%;height:auto"><rect width="1600" height="899" fill="#05070a"/>${Array.from({length:90},(_,i)=>`<circle cx="${(i*379)%1600}" cy="${(i*211)%899}" r="${1+(i%3)*.8}" fill="#9aa4b2" opacity="${.25+(i%4)*.15}"/>`).join('')}<ellipse cx="800" cy="450" rx="560" ry="250" fill="none" stroke="#3a4554" stroke-width="2"/><ellipse cx="800" cy="450" rx="330" ry="140" fill="none" stroke="#3a4554" stroke-width="2"/><circle cx="800" cy="450" r="92" fill="#1a212b" stroke="#97a2b1" stroke-width="3"/><ellipse cx="800" cy="450" rx="160" ry="30" fill="none" stroke="#97a2b1" stroke-width="3"/></svg>`}
    ${pins}<figcaption>${esc(c.place||'')}</figcaption></figure>`;

function issuesNav(cur){

function renderPaper(box, ref = false, E = ep, embed = false){
  if (!E){ box.innerHTML = '<p class="note">次の作戦の発表をお待ちください。</p>'; return; }
  const c = E.content;

     <div class="tags"><span class="tag d-${esc(a.danger)}">危険度 ${esc(a.danger)}</span><span class="tag">推奨能力 ${a.rec.map(k=>esc(SNAME[k])).join('・')}</span><span class="tag">有効な装備 ${a.eq.map(esc).join('・')}</span>${a.main?'<span class="tag">主戦場</span>':''}</div>

  const reqText = s => { const r = s.requires||{}; const out = []; if (r.rank) out.push(`${r.rank}以上`); for (const [k,v] of Object.entries(r.stats||{})) out.push(`${(STATS.find(x=>x[0]===k)||[k,k])[1]}${v}以上`); if (s.free_from) { const f = c.ships.find(x=>x.code===s.free_from); if (f) out.push(`${f.name}から無料で改修`); } return out.join('・'); };
  const optChips = s => s.options?`<div class="opts"><span class="optl">選択装備（${s.option_max||2}つ）</span>${s.options.map((q,i)=>`<span class="opt" title="${esc(q.desc||'')}"><b>${'ABCDE'[i]}</b>${esc(q.name)}<i>${esc(q.type)}</i></span>`).join('')}</div>`:'';
  const newShips = c.ships.filter(s=>s.new), oldShips = c.ships.filter(s=>!s.new);
  const featured = newShips.length ? `<div class="newships"><div class="newships-h">${oldShips.length?`<span class="newtag">新型艦</span>今回から配備された艦（${newShips.length}隻）`:`<span class="newtag">配備艦</span>今回出撃できる艦（${newShips.length}隻）`}</div><div class="nsgrid">${newShips.map(s=>`<article class="nscard">
      ${(s.img||IMG[s.code])?`<div class="nsimg"><img src="${imgSrc(s.img,IMG[s.code])}" alt="${esc(s.name)}"></div>`:''}
      <div class="nsbody"><div class="nsname">${esc(s.name)}</div><div class="nsclass">${esc(s.class)}</div>
      <dl class="nsstats"><div><dt>攻撃</dt><dd>${esc(s.atk)}</dd></div><div><dt>防御</dt><dd>${esc(s.def)}</dd></div><div><dt>機動</dt><dd>${esc(s.mob)}</dd></div><div><dt>功績P</dt><dd>${esc(s.cost)}</dd></div></dl>
      ${reqText(s)?`<div class="nsreq">条件：${esc(reqText(s))}</div>`:''}
      <p class="nsdesc">${esc(s.desc)}</p>${optChips(s)}</div></article>`).join('')}</div></div>` : '';
  const ships = oldShips.map(s=>`<tr><td>${(s.img||IMG[s.code])?`<img class="shipimg" src="${imgSrc(s.img,IMG[s.code])}" alt="${esc(s.name)}">`:''}<b>${esc(s.name)}</b>${s.new?' <span class="newtag">新型</span>':''}<br><span class="note" style="margin:0">${esc(s.class)}　${esc(s.desc)}</span>${reqText(s)?`<span class="note" style="margin:0;display:block">条件：${esc(reqText(s))}</span>`:''}${optChips(s)}</td><td class="num">${esc(s.atk)}</td><td class="num">${esc(s.def)}</td><td class="num">${esc(s.mob)}</td><td class="num">${esc(s.cost)}</td></tr>`).join('');
  const eqs = (c.equipment||[]).map(q=>`<tr><td><b>${esc(q.name)}</b>${q.new?' <span class="newtag">新装備</span>':''}<br><span class="note" style="margin:0">${esc(q.desc)}</span></td><td class="num">${esc(q.type)}</td><td class="num">${esc(q.cost)}</td></tr>`).join('');
  const enemies = (c.enemies||[]).map(x=>`<div class="enemy"><img src="${imgSrc(x.img,whaleImg(x.name))}" alt="${esc(x.name)}"><div><b>${esc(x.name)}</b>${x.new?' <span class="newtag">新型</span>':''}<p style="margin:2px 0">${esc(x.desc)}</p><p class="hint" style="margin:0">${esc(x.hint||'')}</p></div></div>`).join('') + (c.unknown_teaser!==false?`<div class="enemy"><img src="${IMG.whale_unknown}" alt="未確認艦のシルエット"><div><b>未確認艦</b><p style="margin:2px 0">交戦宙域の奥で、正体不明の大型反応が確認されている。</p></div></div>`:'');
  const current = `
    <img class="hero" src="${imgSrc(c.hero,IMG.hero)}" alt="クジラ型艦と交戦する宙航軍の艦隊">
    <div class="sh">導入</div>
    <div class="panel"><p class="intro" style="margin:0">${esc(c.intro)}</p>
      ${(c.commanders||[]).map(m=>`<div class="brief cmd"><img class="face" src="${imgSrc(m.img,IMG.iruka)}" alt="${esc(m.name)}"><div><span class="ctitle">${esc(m.title||'')}</span><b style="color:var(--ink)">${esc(m.name)}</b><p class="cwords">${esc(m.words)}</p></div></div>`).join('')}
      ${c.briefing?`<div class="brief"><img class="face" src="${IMG.iruka}" alt="イルカ中尉"><div><b style="color:var(--ink)">イルカ中尉</b><br>${esc(c.briefing)}</div></div>`:''}</div>
    ${c.story?.text?`<section class="story" data-sec="story"><div class="sh">${esc(c.story.series||'セイ＝ハルカゼの航跡')}</div><div class="storybox">${c.story.img?`<img class="storyimg" src="${imgSrc(c.story.img,'')}" alt="セイ＝ハルカゼ">`:''}<h3>${esc(c.story.title||'')}</h3>${String(c.story.text).split(/\n+/).map(t=>`<p${/^[「『（]/.test(t)?' class="q"':''}>${esc(t)}</p>`).join('')}</div></section>`:''}
    <section data-sec="map"><div class="sh">戦略マップ</div>${mapSvg(c.areas, c)}</section>

    ${c.equipment?.length?`<section data-sec="eq"><div class="sh">装備（1隻4つまで）</div><div class="tbl"><table><thead><tr><th>装備</th><th class="num">種別</th><th class="num">功績P</th></tr></thead><tbody>${eqs}</tbody></table></div></section>`:''}
    <section data-sec="enemy"><div class="sh">敵艦情報</div>${enemies}</section>`;
  if (ref){
    const rpt = renderReport();
    box.innerHTML = current + (rpt ? `<details class="refprev" data-sec="prev"><summary>前回の結果を見る</summary>${rpt}</details>` : '');
  } else if (E !== ep){
    // back issue: the paper as it ran, then that episode's results
    const meta = `<div class="ephead"><div class="ep">第${E.no}話　${esc(E.title)}</div><div class="meta"><span>舞台 <b>${esc(c.place||'')}</b></span><span>${E.status==='done'?'結果発表済み':'判定待ち'}</span></div></div>`;
    const rpt = renderReport(E, 'この回の結果');
    // season over: the final issue opens with its result (and the ending) on top
    box.innerHTML = !ep && E === last
      ? letterCard() + (embed?'':issuesNav(E.no)) + meta + rpt + '<div class="sh" style="margin-top:34px">この回の作戦</div>' + current
      : issuesNav(E.no) + meta + (E.status==='done' ? letterCard(E) : '') + current + (rpt ? `<div style="margin-top:40px">${rpt}</div>` : '');
  } else {
    box.innerHTML = letterCard() + (embed?'':issuesNav(E.no)) + epHead() + (embed?'':todoStrip()) + renderReport() + (last?'<div class="sh" style="margin-top:34px">今回の作戦</div>':'') + current;
  }
}


/* ---------- sortie view: paper beside the form ----------
   Wide screens (>=1100px): two panes, paper left / form right, each scrolls on its own (the usual "reference + form" split).
   Phones & narrow windows: the form fills the screen; a floating 「紙面を見る」 button opens the paper as a bottom sheet
   with jump chips, and closing it returns to the form exactly where you were. */
const WIDE = window.matchMedia('(min-width:1100px)');
const REF_CHIPS = [['areas','エリア'],['ships','艦艇'],['eq','装備'],['enemy','敵艦'],['map','マップ'],['prev','前回']];
function chipsHtml(){ return REF_CHIPS.map(([k,n])=>`<button type="button" class="chip" data-jump="${k}">${n}</button>`).join(''); }
function bindChips(scope, pane){
  scope.querySelectorAll('[data-jump]').forEach(b=>{ if (!pane.querySelector(`[data-sec="${b.dataset.jump}"]`)) b.hidden = true; });
  scope.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{
    const t = pane.querySelector(`[data-sec="${b.dataset.jump}"]`); if (!t) return;
    if (t.tagName==='DETAILS') t.open = true;
    pane.scrollTo({ top: t.offsetTop - pane.offsetTop - 8, behavior: 'smooth' });
  });
}
function renderSortieView(box){
  box.innerHTML = `<div id="narrowPaper"></div><div class="split">
      <aside class="refpane" aria-label="紙面"><div class="refbar">${chipsHtml()}</div><div class="refscroll" id="refPane"></div></aside>
      <div class="formpane" id="formAnchor"><div class="sh fsh">出撃指示書</div><div id="sbox"></div></div>
    </div>
    <button type="button" class="refbtn" id="refBtn" aria-haspopup="dialog">出撃指示へ</button>
    <dialog class="sheet" id="refSheet" aria-label="紙面">
      <div class="sheethead"><div class="grab" aria-hidden="true"></div><div class="sheetrow"><b>第${ep.no}話の紙面</b><button type="button" class="btn ghost sm" id="refClose">閉じて入力に戻る</button></div><div class="refbar">${chipsHtml()}</div></div>
      <div class="refscroll" id="refSheetBody"></div>
    </dialog>`;
  renderSortie($('#sbox'));
  const pane = $('#refPane'), sheet = $('#refSheet'), body = $('#refSheetBody');
  // wide: the full issue in the left pane; narrow: the full issue on top, the form below it
  const np = $('#narrowPaper');
  const fillPane = () => {
    if (!$('#refPane')) return;
    if (WIDE.matches){ np.innerHTML = ''; if (!pane.childElementCount){ renderPaper(pane, false, ep, true); bindChips(pane.parentElement, pane); } }
    else { pane.innerHTML = ''; if (!np.childElementCount) renderPaper(np, false, ep, true); }
    syncBtn();
  };
  // floating button: above the form it jumps down to it; inside the form it opens the paper as a sheet for reference
  const fa = $('#formAnchor'), btn = $('#refBtn');
  let inForm = false;
  const syncBtn = () => { btn.textContent = inForm ? '紙面を見る' : '出撃指示へ'; };
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { inForm = es[0].isIntersecting; syncBtn(); }, {rootMargin:'0px 0px -40% 0px'}).observe(fa);
  fillPane(); WIDE.onchange = fillPane;
  btn.onclick = () => {
    if (!inForm){ fa.scrollIntoView({behavior:'smooth', block:'start'}); return; }
    if (!body.childElementCount){ renderPaper(body, true); bindChips(sheet, body); }
    sheet.showModal(); document.body.classList.add('sheet-open');
  };
  const close = () => { sheet.close(); };
  $('#refClose').onclick = close;
  sheet.addEventListener('close', () => document.body.classList.remove('sheet-open'));
  sheet.addEventListener('click', e => { if (e.target === sheet) close(); });   // tap the dimmed area to close
}

/* ---------- 遊び方 (game guide): the flow of one episode + the war's timeline ---------- */
const GUIDE_STEPS = [
  ['艦長を登録する','メールアドレスで登録し、士官登録をします。名前（全角カタカナ10文字まで）を決め、攻撃・操艦・指揮・工学・直感の5つの能力に合計25点を配分します。少尉、功績P20からのスタートです。'],

  ['出撃指示書を出す','紙面の下（広い画面では右側）の出撃指示書で、部隊（宙域）・艦艇・装備（艦ごとの選択装備から2つ）・作戦方針（積極／標準／慎重）を選びます。功績Pが足りれば昇進もできます（参加した回の次の回から）。締切までは何度でも出し直せます。'],
  ['締切を待つ','締切が来ると受付が閉まり、編集部が判定します。能力・艦・装備に、その場の運が加わって戦いの行方が決まります。宙域の戦いには、敵味方のNPC艦隊も加わっています。'],
  ['結果を読む','次の紙面の冒頭に前回の結果が載ります。宙域ごとの戦況、全艦長の戦闘記録、最活躍者、活躍ランキング。自分の結果は、出撃ページいちばん上の返信ハガキと、出撃指示書の下でも確認できます。'],
  ['次の作戦へ','獲得した功績Pで艦の乗り換えや装備の追加、昇進ができます。艦を撃沈されても艦長は脱出しています（負傷すると次の戦闘だけ能力が下がります）。艦を選び直して、次の作戦に臨みましょう。'],
];
const PREWAR = [
  ['開戦前','平時の航宙軍','人類は星系ジャンプで版図を広げ、首都星系ユクサを中心とする統合宇宙圏を築いた。明確な敵のいない時代、航宙軍の艦隊は最小限に抑えられ、議会からは「金食い虫」とまで言われていた。'],
];

      const st = x.status==='open' ? '<span class="pill ng">出撃受付中</span>' : x.status==='closed' ? '<span class="pill ng">判定中</span>' : rp.judge ? '' : '';
      return `<tr><th>第${x.no}話</th><td><b><a href="#paper${x.id===ep?.id?'':'/'+x.no}">${esc(x.title)}</a></b>　<span class="note" style="margin:0">${esc(c.place||'')}</span> ${st}
        <p>${esc(rp.headline || (x.status==='open' ? '作戦進行中。あなたの出撃を待っている。' : ''))}</p>
        ${rp.ending?`<p class="tl-end">${esc(rp.ending.label||'')}「${esc(rp.ending.title||'')}」</p>`:''}</td></tr>`; }),
    ...Array.from({length: total - eps.length}, (_,i)=>`<tr class="tl-lock"><th>第${eps.length+i+1}話</th><td><b>？？？</b><p>未公開</p></td></tr>`),

    ${gate?'<p style="margin:0 0 12px"><a href="#">← ログイン画面へ戻る</a></p>':''}
    <div class="sh">GAME GUIDE</div>
    <h2 class="gtitle">この読者参加ゲームについて</h2>
    <p class="glead">『星海戦記』は、宇宙クジラと人類の戦争を描く読者参加型の戦記です。あなたは統合宇宙圏・航宙軍の艦長として艦に乗り込み、2週間に一度発表される作戦に出撃します。敵味方の大艦隊がぶつかる戦場で、あなたの選択と戦果が紙面に記録され、物語の行方を左右していきます。</p>
    <div class="gcols">
      <section><div class="gband">早わかり　ゲームの流れ</div>
        <ol class="gsteps">${GUIDE_STEPS.map(([t,d],i)=>`<li><b>${'①②③④⑤⑥'[i]} ${esc(t)}</b><p>${esc(d)}</p></li>`).join('')}</ol>
      </section>
      <section><div class="gband">星海戦記　タイムテーブル</div>
        <table class="tl">${timeline}</table>
        <p class="note">各話の結果しだいで、その先の作戦の難しさや登場する艦が変わります。最終話のあとの戦況で、結末は「完全勝利／判定勝利／引き分け／判定敗北／完全敗北」に分かれます。</p>
      </section>

      <dl class="gkeys">
        <div><dt>功績P</dt><dd>出撃すれば最低5P。撃沈数や危険度、帰還で増えます。艦・装備・昇進に使います。乗り換えると前の艦は半額で下取り。</dd></div>
        <div><dt>作戦方針</dt><dd>積極は戦果が増えるが沈みやすい。慎重はその逆。宙域全体の勝敗には影響しません。</dd></div>
        <div><dt>艦と艦長</dt><dd>艦は「帰還」か「撃沈」。撃沈されると艦と装備を失いますが、艦長は脱出します。負傷すると次の戦闘だけ全能力値−1。</dd></div>
        <div><dt>戦況ゲージ</dt><dd>宙域ごとの勝敗で上下します。主戦場は2倍。「今後の戦局に影響する」宙域の結果は、先の話の展開を変えます。</dd></div>
      </dl>
    </section>
  </div>`;
}

/* ---------- ranking (replaces the roster): season total + each episode's top 10 with the No.1's story ---------- */
function renderRanking(box, sel){
  const done = (epsAll||[]).filter(x=>x.report?.entries?.length).sort((a,b)=>b.no-a.no);
  if (!done.length){ box.innerHTML = '<p class="note">まだ結果の出た作戦はありません。最初の作戦の結果が出ると、ここにランキングが載ります。</p>'; return; }
  const rankNow = Object.fromEntries((roster||[]).map(r=>[r.id, r.rank]));
  // season total, summed from every published result
  const tot = {};
  for (const e of done) for (const x of e.report.entries){
    const t = tot[x.id] ||= {id:x.id, name:x.name, merit:0, kills:0, sorties:0, mvp:0};
    if (x.outcome !== '未出撃'){ t.sorties++; t.merit += x.merit||0; t.kills += x.kills||0; }
  }
  for (const e of done){ const top = e.report.ranking?.[0]; if (top && tot[top]) tot[top].mvp++; }
  const season = Object.values(tot).filter(t=>t.sorties).sort((a,b)=>b.merit-a.merit || b.kills-a.kills || a.name.localeCompare(b.name,'ja'));
  let pos = 0, prev = null;
  season.forEach((t,i)=>{ const key = t.merit+'/'+t.kills; if (key!==prev){ pos = i+1; prev = key; } t.pos = pos; });
  const myRow = me && season.find(t=>t.id===me.id);
  const shown = season.slice(0, 20);
  const srow = t => `<tr class="${me&&t.id===me.id?'mine':''}"><td class="num"><b>${t.pos}</b></td><td><b>${esc(t.name)}</b> <span class="note" style="margin:0">${esc(rankNow[t.id]||'')}</span>${t.mvp?` <span class="newtag" title="各回1位の回数">1位×${t.mvp}</span>`:''}</td><td class="num">${t.sorties}</td><td class="num">${t.kills}</td><td class="num"><b>${t.merit}</b></td></tr>`;

  const cur = done.find(e=>e.no===Number(sel)) || done[0];
  const rp = cur.report, byId = Object.fromEntries(rp.entries.map(x=>[x.id,x]));
  const aname = c => (cur.content?.areas||[]).find(a=>a.code===c)?.name || '';
  const top = (rp.ranking||[]).map(id=>byId[id]).filter(Boolean);
  const first = top[0];
  const story = first ? (rp.mvp && rp.mvp.name===first.name ? rp.mvp.text
      : `${aname(first.area)}に出撃し、${first.kills?`敵艦${first.kills}隻を撃沈`:'最後まで戦い抜き'}、功績P${first.merit}を獲得した。`) : '';
  const myEp = me && byId[me.id] && byId[me.id].outcome!=='未出撃' ? (()=>{ const sorted = rp.entries.filter(x=>x.outcome!=='未出撃').sort((a,b)=>b.merit-a.merit||b.kills-a.kills); return ((rp.ranking||[]).indexOf(me.id)+1) || sorted.findIndex(x=>x.id===me.id)+1; })() : 0;

  box.innerHTML = `
    <section style="margin-top:0"><div class="sh">全回通算　功績ランキング</div>
      <p class="note" style="margin:-4px 0 8px">第${done[done.length-1].no}話〜第${done[0].no}話の獲得功績Pの合計（使ったPは引きません）</p>
      <div class="tbl"><table><thead><tr><th class="num">順位</th><th>艦長</th><th class="num">出撃</th><th class="num">撃沈</th><th class="num">功績P</th></tr></thead>
      <tbody>${shown.map(srow).join('')}${myRow && myRow.pos>20 ? `<tr><td colspan="5" class="note" style="text-align:center">…</td></tr>${srow(myRow)}`:''}</tbody></table></div>
    </section>
    <section><div class="sh">各回の功績ランキング</div>
      <nav class="issues" aria-label="回を選ぶ">${done.map(e=>`<a class="issue" href="#rank/${e.no}" ${e.no===cur.no?'aria-current="page"':''}>第${e.no}話<span>${esc(e.title)}</span></a>`).join('')}</nav>
      ${first?`<div class="panel champ"><div class="sh" style="margin:0 0 4px">第${cur.no}話　1位</div>
        <div class="champname">${esc(first.rank)}　${esc(first.name)}</div>
        <div class="note" style="margin:2px 0 0">${esc(first.area)} ${esc(aname(first.area))}／${esc(first.ship||'')}／撃沈 ${first.kills}／功績P +${first.merit}</div>
        <p style="margin:8px 0 0">${esc(story)}</p></div>`:''}
      ${myEp?`<p class="note" style="margin:8px 0 0">あなたはこの回 <b style="color:var(--glow)">${myEp}位</b> でした。</p>`:''}
      <div class="tbl" style="margin-top:10px"><table><thead><tr><th class="num">順位</th><th>艦長</th><th>宙域・艦</th><th class="num">撃沈</th><th class="num">功績P</th></tr></thead>
      <tbody>${top.map((x,i)=>`<tr class="${me&&x.id===me.id?'mine':''}"><td class="num"><b>${i+1}</b></td><td><b>${esc(x.name)}</b> <span class="note" style="margin:0">${esc(x.rank)}</span></td><td>${esc(x.area)} ${esc(aname(x.area))}<span class="note" style="margin:0;display:block">${esc(x.ship||'')}</span></td><td class="num">${x.kills}</td><td class="num"><b>${x.merit}</b></td></tr>`).join('')}</tbody></table></div>
      <p class="note"><a href="#paper/${cur.no}">第${cur.no}話の紙面で全員の戦闘記録を読む</a></p>
    </section>`;
}

/* ---------- 編集部 (editor only): drop images onto an episode, place the map pins ---------- */
const pinSide = (x) => x < 50 ? `left:${Math.max(1.5, x-12)}%` : `right:${Math.max(1.5, 100-x-12)}%`;
let adminEps = [], adminSel = null;
const SLOT_SIZE = { hero:[1200,900], map:[1600,1000], ship:[640,400], enemy:[640,400] };

// shrink to fit, trim plain margins on cut-outs (ships / enemies), encode as webp
async function prepImage(file, slot){
  const bmp = await createImageBitmap(file);
  let sx = 0, sy = 0, sw = bmp.width, sh = bmp.height;
  if (slot === 'ship' || slot === 'enemy'){
    const cv = new OffscreenCanvas(bmp.width, bmp.height), cx = cv.getContext('2d'); cx.drawImage(bmp, 0, 0);
    const d = cx.getImageData(0, 0, bmp.width, bmp.height).data, W = bmp.width, H = bmp.height;
    const bg = [d[0], d[1], d[2]], far = i => Math.abs(d[i]-bg[0]) + Math.abs(d[i+1]-bg[1]) + Math.abs(d[i+2]-bg[2]) > 40;
    let x0 = W, y0 = H, x1 = 0, y1 = 0;
    for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (far((y*W + x)*4)){ if (x<x0)x0=x; if (x>x1)x1=x; if (y<y0)y0=y; if (y>y1)y1=y; }
    if (x1 > x0 && y1 > y0){ const pad = Math.round(Math.max(W,H)*0.02); sx = Math.max(0,x0-pad); sy = Math.max(0,y0-pad); sw = Math.min(W,x1+pad)-sx; sh = Math.min(H,y1+pad)-sy; }
  }
  const [mw, mh] = SLOT_SIZE[slot], k = Math.min(1, mw/sw, mh/sh);
  const out = document.createElement('canvas'); out.width = Math.round(sw*k); out.height = Math.round(sh*k);
  const ox = out.getContext('2d');
  if (slot === 'ship' || slot === 'enemy'){ ox.fillStyle = '#fff'; ox.fillRect(0,0,out.width,out.height); }
  ox.drawImage(bmp, sx, sy, sw, sh, 0, 0, out.width, out.height);
  return await new Promise(res => out.toBlob(res, 'image/webp', 0.8));
}

async function uploadSlot(E, slot, key, file, msgEl){
  try{
    msgEl.className = 'msg'; msgEl.textContent = '画像を整えています…';
    const blob = await prepImage(file, slot);
    msgEl.textContent = 'アップロードしています…';
    const safe = slot === 'enemy' ? 'e' + (E.content.enemies||[]).findIndex(x=>x.name===key) : (key || slot).replace(/[^a-z0-9_]/gi,'');
    const path = `s${SEASON}/ep${E.no}/${slot}-${safe}-${Date.now()}.webp`;
    const up = await sb.storage.from('seikai').upload(path, blob, { contentType:'image/webp', upsert:false });
    if (up.error) throw up.error;
    const url = sb.storage.from('seikai').getPublicUrl(path).data.publicUrl;
    const { data, error } = await sb.rpc('admin_set_image', { p_episode: E.id, p_slot: slot, p_key: key || '', p_url: url });
    if (error) throw error;
    E.content = data; msgEl.className = 'msg ok'; msgEl.textContent = '差し込みました。';
    renderAdmin($('#view'), true);
  }catch(err){ msgEl.className = 'msg err'; msgEl.textContent = '失敗しました：' + (err.message || err); }
}

function dropZone(id, label){ return `<label class="drop" id="${id}"><input type="file" accept="image/png,image/jpeg,image/webp" hidden><span>${label}</span></label><div class="msg" id="${id}-m" role="status"></div>`; }
function bindDrop(id, fn){
  const z = document.getElementById(id); if (!z) return; const m = document.getElementById(id+'-m');
  const go = f => { if (f && /^image\//.test(f.type)) fn(f, m); else { m.className='msg err'; m.textContent='画像ファイル（PNG・JPEG・WebP）を置いてください。'; } };
  z.querySelector('input').onchange = e => go(e.target.files[0]);
  z.ondragover = e => { e.preventDefault(); z.classList.add('over'); };
  z.ondragleave = () => z.classList.remove('over');
  z.ondrop = e => { e.preventDefault(); z.classList.remove('over'); go(e.dataTransfer.files[0]); };
}

  }

  const E = adminEps.find(x=>x.id===adminSel) || adminEps.find(x=>x.status==='draft') || adminEps.find(x=>x.status==='open') || adminEps[adminEps.length-1];
  adminSel = E.id;
  const c = E.content || {}, ST = {draft:'下書き',open:'受付中',closed:'締切',done:'結果発表済み'};
  const pos = {...(c.map_pos || {A:[22,30],B:[83,36],C:[17,68],D:[83,70]})};

  const ships = (c.ships||[]).slice().sort((a,b)=>(b.new?1:0)-(a.new?1:0));

    <nav class="issues">${adminEps.map(x=>`<a class="issue" href="#admin" data-ep="${x.id}" ${x.id===E.id?'aria-current="page"':''}>第${x.no}話<span>${esc(x.title)}・${ST[x.status]||x.status}</span></a>`).join('')}</nav>
    <section class="aslot"><div class="sh">扉絵</div><div class="arow">${thumb(imgSrc(c.hero,''), '扉絵')}<div style="flex:1">${dropZone('d-hero','扉絵をここに置く')}</div></div></section>
    <section class="aslot"><div class="sh">戦略マップ</div>
      <div id="amap">${c.map_image ? mapSvg(c.areas||[], {...c, map_pos: pos}) : '<div class="athumb none" style="width:100%;height:160px">マップ画像なし</div>'}</div>
      ${c.map_image ? '<p class="note">丸い点をドラッグすると、A〜Dの札の位置を動かせます。動かしたら「位置を保存」を押してください。</p><button class="btn sm" id="pinSave">位置を保存</button> <span class="msg" id="pinMsg"></span>' : ''}
      ${dropZone('d-map','マップ画像をここに置く')}</section>
    <section class="aslot"><div class="sh">艦艇</div><div class="agrid">${ships.map((s,i)=>`<div class="acard"><b>${esc(s.name)}</b>${s.new?' <span class="newtag">新型</span>':''}${thumb(s.img ? imgSrc(s.img,'') : IMG[s.code], s.name)}${dropZone('d-ship-'+i, 'ここに置く')}</div>`).join('')}</div></section>
    <section class="aslot"><div class="sh">敵艦</div><div class="agrid">${(c.enemies||[]).map((x,i)=>`<div class="acard"><b>${esc(x.name)}</b>${x.new?' <span class="newtag">新型</span>':''}${thumb(imgSrc(x.img, whaleImg(x.name)), x.name)}${dropZone('d-enemy-'+i, 'ここに置く')}</div>`).join('')}</div></section>
  </div>`;
  box.querySelectorAll('[data-ep]').forEach(a=>a.onclick = ev => { ev.preventDefault(); adminSel = Number(a.dataset.ep); renderAdmin(box, true); });
  bindDrop('d-hero', (f,m)=>uploadSlot(E,'hero','',f,m));
  bindDrop('d-map', (f,m)=>uploadSlot(E,'map','',f,m));
  ships.forEach((s,i)=>bindDrop('d-ship-'+i, (f,m)=>uploadSlot(E,'ship',s.code,f,m)));
  (c.enemies||[]).forEach((x,i)=>bindDrop('d-enemy-'+i, (f,m)=>uploadSlot(E,'enemy',x.name,f,m)));
  // draggable pin anchors
  const fig = box.querySelector('#amap .map'); if (!fig) return;

  codes.forEach((code, i) => {
    const dot = document.createElement('button'); dot.type = 'button'; dot.className = 'mdot'; dot.title = code + ' を動かす';

    place(); fig.appendChild(dot);
    dot.onpointerdown = ev => { ev.preventDefault(); dot.setPointerCapture(ev.pointerId);

  };

const PENDING_KEY = 'seikai_pending_sortie';
function savePending(d){ try { localStorage.setItem(PENDING_KEY, JSON.stringify({...d, ep: ep?.id, at: Date.now()})); } catch(e){} }
function readPending(){ try { const d = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null'); return d && d.ep === ep?.id ? d : null; } catch(e){ return null; } }

async function submitNewcomer(d){
  const c = await sb.rpc('create_character', { p_name: d.name, p_gender: d.gender, p_appearance: '', p_stats: d.stats, p_portrait_ok: true });
  if (c.error) return c.error.message;
  const o = d.order;
  const r = await sb.rpc('submit_order', { p_area: o.area, p_ship: o.ship, p_equipment: o.eq, p_wingman: null, p_promote: false, p_stat_up: {}, p_free_action: '', p_stance: o.stance });
  return r.error ? `艦長は登録できましたが、出撃指示を送れませんでした（${r.error.message}）。出撃タブから出し直してください。` : '';
}
function renderLogin(box){
  document.body.classList.remove('split-on');
  let mode = 'login';
  box.innerHTML = `<div class="gate" style="padding-top:8px"><form class="card" id="authForm" novalidate>
      <h2 style="font-size:20px;margin-top:0">ログイン</h2>
      <p class="note" style="margin-top:0">はじめての方は、<a href="#sortie">出撃タブ</a>で艦長の名前と出撃先を決めてから「出撃する」を押すと、そのまま登録できます。</p>
      <div class="seg" role="group" aria-label="ログインか新規登録か"><button type="button" data-m="login" aria-pressed="true">ログイン</button><button type="button" data-m="signup" aria-pressed="false">新規登録だけする</button></div>
      <div class="field"><label for="aEmail">メールアドレス</label><input type="email" id="aEmail" autocomplete="email" required></div>
      <div class="field"><label for="aPass">パスワード<small id="aPassHint"></small></label><input type="password" id="aPass" autocomplete="current-password" minlength="6" required></div>
      <div class="field" id="aPass2Wrap" hidden><label for="aPass2">パスワード（確認）</label><input type="password" id="aPass2" autocomplete="new-password"></div>
      <button class="btn full" id="aBtn" type="submit">ログイン</button>
      <div class="msg" id="aMsg" role="status"></div>
    </form></div>`;
  const setMode = m => { mode = m;
    box.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.m===m));
    $('#aPass2Wrap').hidden = m!=='signup'; $('#aBtn').textContent = m==='signup'?'登録する':'ログイン';
    $('#aPass').autocomplete = m==='signup'?'new-password':'current-password';
    $('#aPassHint').textContent = m==='signup'?'6文字以上':''; $('#aMsg').textContent=''; };
  box.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const msg = $('#aMsg'); msg.className = 'msg err';
    const email = $('#aEmail').value.trim(), pass = $('#aPass').value;
    if (!email || !pass){ msg.textContent = 'メールアドレスとパスワードを入れてください。'; return; }
    if (mode==='signup'){
      if (pass.length < 6){ msg.textContent = 'パスワードは6文字以上にしてください。'; return; }
      if (pass !== $('#aPass2').value){ msg.textContent = '確認用のパスワードが一致しません。'; return; }
    }
    $('#aBtn').disabled = true; msg.className='msg'; msg.textContent = mode==='signup'?'登録しています…':'ログインしています…';
    const { data, error } = mode==='signup' ? await sb.auth.signUp({ email, password: pass }) : await sb.auth.signInWithPassword({ email, password: pass });
    $('#aBtn').disabled = false;
    if (error){ msg.className='msg err'; msg.textContent = AUTH_JA(error.message); return; }
    if (!data.session){ msg.className='msg ok'; msg.textContent = '確認メールを送りました。メール内のリンクを開いてから、ログインしてください。'; setMode('login'); return; }
    session = data.session; history.replaceState(null, '', '#sortie'); await enterApp();
  };
}

/* ---------- router ---------- */
const VIEWS = ['login','register','home','paper','sortie','rank','guide','roster','admin'];
function route(){
  let [v, arg] = location.hash.slice(1).split('/'); if (!VIEWS.includes(v)) v = session ? 'sortie' : 'paper';   // guests start on the paper, captains on the order form
  const tv = v;
  document.querySelectorAll('#tabs a').forEach(a=> a.dataset.v===tv ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  const box = $('#view');
  if (v==='roster') v = 'rank';
  if (v==='home' || v==='register') v = 'sortie';   // sign-up now lives on the 出撃 page
  if (v==='admin' && !isAdmin) v = 'sortie';
  if (v==='admin'){ document.body.classList.remove('split-on'); renderAdmin(box); window.scrollTo(0,0); return; }
  const canOrder = !!ep && ((!!me && me.state==='active') || !me);   // no captain yet = the newcomer sheet
  document.body.classList.toggle('split-on', v==='sortie' && canOrder);
  if (v==='login'){ if (session){ location.replace('#sortie'); return; } renderLogin(box); }
  else if (v==='paper'){ const bk = arg && epsAll.find(x=>x.no===Number(arg)); renderPaper(box, false, bk && bk.id!==ep?.id ? bk : (ep || last)); }
  else if (v==='sortie'){ if (canOrder) renderSortieView(box); else if (ep || last) renderPaper(box, false, ep || last, true); else box.innerHTML = '<p class="note">現在、受付中の作戦はありません。</p>'; }
  else if (v==='guide') renderGuide(box);
  else renderRanking(box, arg);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', () => { if (!$('#app').hidden) route(); });
// before login: the guide can be read from the gate
async function gateRoute(){
  if (location.hash === '#guide'){
    if (!epsAll.length){ await ensureSeason(); const r = await sb.from('episodes').select('id,no,title,status,content,report').eq('season_id', SEASON).neq('status','draft').order('no'); epsAll = r.data || []; }
    $('#app').hidden = true; $('#gate').hidden = false; renderGuide($('#gate'), true); window.scrollTo(0,0);
  } else renderGate();
}

}

const OUT_CLS = {'帰還':'good','損傷':'glow','大破':'warn','撃沈':'bad','消息不明':'bad','未出撃':'sub'};

  const mine = me && byId[me.id];

  return `<section class="report" style="margin-top:0">${ending}<div class="sh"${ending?' style="margin-top:22px"':''}>${title}　第${L.no}話「${esc(L.title)}」</div>
    <div class="panel">
      <h3 class="headline">${esc(rp.headline||'')}</h3>
      ${rp.img?`<figure class="rpimg"><img src="${imgSrc(rp.img,'')}" alt="${esc(rp.img_caption||rp.headline||'戦闘の挿絵')}" loading="lazy">${rp.img_caption?`<figcaption>${esc(rp.img_caption)}</figcaption>`:''}</figure>`:''}
      <p style="margin:8px 0 0">${esc(rp.summary||'')}</p>
      ${g0!=null?`<div class="gauge" role="img" aria-label="戦況ゲージ ${g0}から${g1}"><span class="gl">戦況</span><div class="gbar"><i style="width:${g1}%"></i><b style="left:${g0}%"></b></div><span class="gv">${g0} → <b>${g1}</b></span></div>
      <div class="note" style="margin-top:2px">右へ伸びるほど航宙軍が優勢。最終話の結末を左右します</div>`:''}
      ${mine?`<div class="order-now">あなたの結果：${esc(mine.area||'')} ${esc(aname(mine.area))}／<span class="out o-${OUT_CLS[mine.outcome]||'sub'}">${esc(mine.outcome)}</span>　撃沈 ${mine.kills}　功績P +${mine.merit}</div>`:''}
    </div>
    <div class="areas" style="margin-top:12px">${areas.map(a=>{ const list = ent.filter(x=>x.area===a.code);
      return `<article class="area"><h3><span class="code">${esc(a.code)}</span>${esc(a.name)}<span class="res r-${esc(a.result)}">${esc(a.result)}</span></h3>
      <p>${esc(rp.area_text?.[a.code]||'')}</p>
      ${list.length?`<details><summary>戦闘記録（${list.length}名）</summary><div class="tbl" style="margin-top:8px"><table><thead><tr><th>艦長</th><th>艦</th><th>結果</th><th class="num">撃沈</th><th class="num">功績P</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div></details>`:''}</article>`; }).join('')}</div>
    ${rp.mvp?`<div class="panel mvp" style="margin-top:12px"><div class="sh" style="margin:0 0 4px">最活躍</div><b class="mvpname">${esc(rp.mvp.rank)}　${esc(rp.mvp.name)}</b><p style="margin:4px 0 0;font-size:14px">${esc(rp.mvp.text)}</p></div>`:''}
    ${(rp.ranking||[]).length?`<div class="sh" style="margin-top:22px">活躍ランキング</div><ol class="rank">${rp.ranking.slice(0,RANK_TOP).map(id=>byId[id]).filter(Boolean).map(x=>`<li class="${me&&x.id===me.id?'mine':''}"><b>${esc(x.name)}</b><span class="r">${esc(x.area)} ${esc(aname(x.area))}　撃沈${x.kills}　+${x.merit}P</span></li>`).join('')}</ol>${(()=>{ const k = me ? rp.ranking.indexOf(me.id) : -1; return k >= RANK_TOP ? `<p class="note" style="margin:6px 0 0">あなたの順位：${k+1}位（全${rp.ranking.length}名中）</p>` : ''; })()}`:''}

/* ---------- 返信ハガキ：自分だけに届く前回の結果 ----------
   Only built for the signed-in captain from their own order (owner-only) and result.
   Editor-written text and special notices come from the private `letters` table (RLS: owner only). */
function autoLetter(mine, A, lc, order, no = last?.no){
  const shipObj = (lc.ships||[]).find(s=>s.name===mine.ship || s.code===order?.ship_code);
  const opts = shipObj?.options || lc.equipment || [];
  const eqs = (order?.equipment||[]).map(code=>opts.find(q=>q.code===code)).filter(Boolean);
  const fit = eqs.filter(q=>(A?.eq||[]).includes(q.type)), miss = eqs.filter(q=>!(A?.eq||[]).includes(q.type));
  const aname = A ? `${A.code} ${A.name}` : mine.area;
  const s = [];
  s.push(`第${no}話、貴官の${mine.ship}は${aname}に出撃した。`);
  if (fit.length) s.push(`${fit.map(q=>q.name).join('と')}が宙域の状況によく合い、戦いを支えた。`);
  else if (eqs.length) s.push(`${eqs.map(q=>q.name).join('と')}を積んでいたが、この宙域で求められる装備（${(A?.eq||[]).join('・')}）とは噛み合わなかった。`);
  const pre = mine.stance==='積極' ? '前に出て' : mine.stance==='慎重' ? '距離を取りつつ' : '';
  s.push(mine.kills>=3 ? `${pre}敵艦${mine.kills}隻を撃沈する目覚ましい戦果を挙げた。`
    : mine.kills>0 ? `${pre}敵艦${mine.kills}隻を撃沈した。`
    : mine.outcome==='撃沈' ? '撃沈には至らなかった。' : '撃沈には至らなかったが、最後まで持ち場を守り抜いた。');
  if (mine.outcome==='撃沈') s.push(mine.injured ? '艦は集中砲火を受けて撃沈され、貴官は負傷して脱出した。' : '艦は撃沈されたが、貴官は無傷で脱出し、救助されている。');
  else s.push('艦は無事に帰還した。');
  if (A?.result) s.push(`${A.main?'主戦場となった':''}${A.name}の戦いは「${A.result}」に終わった。`);
  return s.join('');
}
function letterCard(L = last){
  if (!me || !L?.report?.judge) return '';
  const past = L.id !== last?.id;   // a back issue: only what happened then, nothing about the captain's state now
  const myLetter = myLetters[L.id] || null, lastOrder = myOrders[L.id] || null;
  const rp = L.report, lc = L.content || {};
  const mine = (rp.entries||[]).find(x=>x.id===me.id);
  if (!mine && !myLetter) return '';
  const A = mine ? (rp.judge.areas||[]).map(a=>({...a, ...((lc.areas||[]).find(x=>x.code===a.code)||{})})).find(a=>a.code===mine.area) : null;
  const sortied = mine && mine.outcome !== '未出撃';
  const pos = sortied ? (rp.ranking||[]).indexOf(me.id) + 1 : 0;
  const mvp = sortied && rp.ranking?.[0] === me.id;
  // notices: automatic ones first, then whatever the editor sent (二階級特進、特別艦の支給 など)
  const N = [];
  if (mvp) N.push({kind:'honor', title:'最活躍士官', text:'今回もっとも活躍した士官として紙面で紹介されています。'});
  else if (pos && pos <= RANK_TOP) N.push({kind:'honor', title:`活躍ランキング ${pos}位`, text:'紙面のランキングに名前が載っています。'});
  for (const n of (myLetter?.notices||[])) N.push(n);
  if (sortied && mine.outcome==='撃沈') N.push({kind:'warn', title:'艦を失いました', text: past ? '艦は撃沈されましたが、脱出しています。' : '次の出撃では艦を選び直してください。'});
  if (!past && me.injured) N.push({kind:'warn', title:'負傷中', text:'次の戦闘だけ、全能力値が1下がります。'});
  const next = RANKS[RANKS.indexOf(me.rank)+1], cost = RANK_COST[me.rank];
  if (!past && ep && next && cost && me.merit >= cost && (me.joined_no||0) < ep.no) N.push({kind:'good', title:'昇進できます', text:`${me.rank}→${next}（${cost}P）。出撃指示書で選べます。`});
  const closing = mvp ? '司令部は貴官の奮戦を高く評価している。' : (past ? mine?.injured : me.injured) ? 'まずは傷を癒やし、次の作戦に備えられたい。'
    : sortied && mine.outcome==='撃沈' ? '新たな艦を手配し、次の作戦に備えられたい。' : sortied ? '次の作戦でも貴官の活躍を期待する。' : '';
  const body = myLetter?.body || (sortied ? autoLetter(mine, A, lc, lastOrder, L.no) + closing
    : `第${L.no}話では、貴官からの出撃指示は届かなかった。次の作戦では貴官の出撃を待っている。`);
  const stat = sortied ? `<dl class="pc-stats">
      <div><dt>部隊</dt><dd>${esc(mine.area)} ${esc(A?.name||'')}${A?.result?`<span class="pc-res">${esc(A.result)}</span>`:''}</dd></div>
      <div><dt>艦</dt><dd>${esc(mine.ship||'—')}　${mine.outcome==='撃沈'?'<b class="pc-bad">撃沈</b>':'帰還'}</dd></div>
      <div><dt>艦長</dt><dd>${mine.injured?'<b class="pc-bad">負傷</b>':'無事'}</dd></div>
      <div><dt>撃沈</dt><dd><b>${mine.kills}</b> 隻</dd></div>
      <div><dt>獲得功績P</dt><dd><b class="pc-big">+${mine.merit}</b></dd></div>
      ${past?'':`<div><dt>現在の功績P</dt><dd><b>${me.merit}</b></dd></div>`}
    </dl>` : '';
  const ICON = {honor:'★', good:'▲', warn:'！', special:'◆', double_promotion:'◆', ship_grant:'◆'};
  const notes = N.length ? `<ul class="pc-notes">${N.map(n=>`<li class="pc-n-${esc(n.kind||'special')}"><span class="pc-ic" aria-hidden="true">${ICON[n.kind]||'◆'}</span><b>${esc(n.title||'特別通達')}</b>${n.text?`<span>${esc(n.text)}</span>`:''}</li>`).join('')}</ul>` : '';
  return `<section class="postcard" aria-label="あなただけの戦闘結果通知">
    <div class="pc-head"><span class="pc-from">航宙軍司令部　戦闘結果通知</span><span class="pc-ep">第${L.no}話「${esc(L.title)}」</span><span class="pc-stamp" aria-hidden="true">親展</span></div>
    <div class="pc-to">${esc(past ? (mine?.rank||me.rank) : me.rank)}　<b>${esc(me.name)}</b>　殿</div>
    ${stat}${notes}
    <p class="pc-body">${esc(body)}</p>
    <div class="pc-sign">航宙軍司令部　イルカ中尉</div>
    <div class="pc-foot">この欄はあなたにしか表示されません${past?'':`　<a href="#paper/${L.no}">第${L.no}話の紙面を読む</a>`}</div>
  </section>`;
}

function renderRegister(box){
  const st = {attack:5,helm:5,command:5,engineering:5,intuition:5};
  box.innerHTML = `<div class="sh">キャラクター登録</div><div class="card">
    <h2 style="font-size:20px">士官登録</h2>
    <div class="field"><label for="rName">名前<small>全角カタカナ10文字まで。「・」「＝」も使えます</small></label><input type="text" id="rName" maxlength="10" placeholder="例）アルト＝カミナギ"></div>
    <div class="field"><span class="lbl">性別</span><div class="choices two" style="grid-template-columns:repeat(3,1fr)">${['男','女','その他'].map((g,i)=>`<label class="choice"><input type="radio" name="rGender" value="${g}" ${i===0?'checked':''}><span class="t">${g}</span></label>`).join('')}</div></div>
    <div class="field"><label for="rLook">外見（任意）<small>300文字まで。挿絵を作るときの参考にします</small></label><textarea id="rLook" maxlength="300"></textarea></div>
    <div class="field"><span class="lbl">能力値<small>合計25、各0〜10</small></span><div id="rStats"></div><div class="total"><span>合計</span><b id="rTotal">25 / 25</b></div></div>
    <div class="field"><label class="choice"><input type="checkbox" id="rPortrait" checked><span><span class="t">肖像を描いてよい</span><span class="d">活躍したとき、紙面にAIで描いた肖像が載ることがあります</span></span></label></div>
    <button class="btn full" id="rBtn">登録する</button><div class="msg" id="rMsg" role="status"></div></div>`;
  const draw = () => {
    const total = Object.values(st).reduce((a,b)=>a+b,0);
    $('#rStats').innerHTML = STATS.map(([k,n,d])=>`<div class="stat"><div><b>${n}</b><br><small style="color:var(--sub);font-size:11px">${d}</small></div><div class="bar"><i style="width:${st[k]*10}%"></i></div>
      <div class="step"><button type="button" data-k="${k}" data-d="-1" aria-label="${n}を下げる" ${st[k]<=0?'disabled':''}>−</button><output>${st[k]}</output><button type="button" data-k="${k}" data-d="1" aria-label="${n}を上げる" ${st[k]>=10||total>=25?'disabled':''}>＋</button></div></div>`).join('');
    $('#rTotal').textContent = `${total} / 25`; $('#rTotal').className = total===25?'ok':'';
    $('#rStats').querySelectorAll('button').forEach(b=>b.onclick=()=>{ st[b.dataset.k]+= +b.dataset.d; draw(); });
  };
  draw();
  $('#rBtn').onclick = async () => {
    const msg = $('#rMsg'); msg.className='msg';
    const total = Object.values(st).reduce((a,b)=>a+b,0);
    if (total !== 25){ msg.className='msg err'; msg.textContent='能力値の合計を25にしてください。'; return; }
    $('#rBtn').disabled = true; msg.textContent = '登録しています…';
    const { error } = await sb.rpc('create_character', { p_name: $('#rName').value.trim(), p_gender: document.querySelector('input[name=rGender]:checked').value, p_appearance: $('#rLook').value, p_stats: st, p_portrait_ok: $('#rPortrait').checked });

    if (location.hash !== '#sortie') history.replaceState(null, '', '#sortie');   // registered: back to the issue, now with the order button
    await loadAll();
  };
}
