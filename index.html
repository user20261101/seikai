<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星海戦記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: one dark column like a fleet briefing sheet; the paper (story, areas, ships) on top, your sortie form below */
:root{
  color-scheme: dark;
  --bg:#0d1015; --panel:#141921; --panel2:#1a212b; --ink:#e7ebf0; --sub:#97a2b1; --rule:#2a3341;
  --glow:#9fd8ea; --warn:#e6a85c; --bad:#ec7a68; --good:#86d6a6;
  --f-head:"Noto Serif JP","Hiragino Mincho ProN",serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.8;padding-inline:16px}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 80px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
a{color:var(--glow)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.mast{border-bottom:1px solid var(--rule);padding-bottom:16px;margin-bottom:22px}
.mast .series{font-family:var(--f-head);font-weight:900;font-size:clamp(34px,9vw,52px);letter-spacing:.12em;line-height:1.1}
.mast .ep{font-family:var(--f-head);font-weight:600;font-size:clamp(18px,4.4vw,24px);margin-top:6px}
.mast .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--sub);font-size:13px;margin-top:8px}
.mast .meta b{color:var(--ink);font-weight:700}
section{margin-top:30px}
.sh{font-size:13px;letter-spacing:.2em;color:var(--glow);font-family:var(--f-body);font-weight:700;margin-bottom:10px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:18px}
.intro{font-family:var(--f-head);font-size:16px;line-height:2}
.brief{display:grid;grid-template-columns:96px 1fr;gap:14px;margin-top:16px;font-size:14px;color:var(--sub);align-items:start}
.brief .face{width:96px;height:120px;border-radius:6px;border:1px solid var(--rule);object-fit:cover;object-position:50% 8%;background:#f5f5f3}
/* Illustrations from the original 星海戦記 (2025). Printed-paper tiles: light ground, thin rule */
.mast{display:flex;gap:16px;align-items:center}
.mast .logo{width:86px;height:86px;border-radius:6px;border:1px solid var(--rule);flex:none;object-fit:cover}
.hero{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--rule);margin-bottom:18px}
.shipimg{display:block;width:120px;height:62px;object-fit:contain;background:#f5f6f8;border-radius:4px;padding:3px;margin-bottom:6px}
.choice .shipimg{width:72px;height:40px;margin:0;flex:none}
.enemy{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:start}
.enemy img{width:132px;height:80px;object-fit:contain;background:#fefefe;border-radius:4px;padding:4px}
@media(max-width:480px){.enemy{grid-template-columns:96px 1fr}.enemy img{width:96px;height:62px}.brief{grid-template-columns:72px 1fr}.brief .face{width:72px;height:92px}.mast .logo{width:64px;height:64px}}
.map{position:relative;margin:6px 0 0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:#000}
.map img{display:block;width:100%;height:auto}
.map .pin{position:absolute;transform:translateY(-50%);max-width:47%;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:99px;background:rgba(8,10,14,.78);border:1px solid rgba(255,255,255,.28);font-size:13px;color:#fff;line-height:1.35}
.map .pin b{flex:none}
.map .pin b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--glow);color:#0d1015;font-family:var(--f-head);font-size:15px}
.map .pin.d-最高 b{background:var(--bad)}.map .pin.d-高 b{background:var(--warn)}.map .pin.d-低 b{background:var(--good)}
.map figcaption{position:absolute;right:10px;bottom:6px;font-size:12px;letter-spacing:.3em;color:rgba(255,255,255,.7)}
@media(max-width:480px){.map .pin{font-size:11px;padding:2px 7px 2px 3px;gap:4px}.map .pin b{width:19px;height:19px;font-size:12px}}
.areas{display:grid;gap:10px}
.area{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--panel)}
.area h3{font-size:17px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.area h3 .code{font-family:var(--f-head);font-weight:900;color:var(--glow);font-size:20px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px}
.tag{border:1px solid var(--rule);border-radius:3px;padding:0 7px;color:var(--sub)}
.tag.d-低{color:var(--good);border-color:currentColor}.tag.d-中{color:var(--glow);border-color:currentColor}
.tag.d-高{color:var(--warn);border-color:currentColor}.tag.d-最高{color:var(--bad);border-color:currentColor}
.area p{margin:6px 0 0;font-size:14px}
.tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;color:var(--sub);font-weight:700;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.enemy{border-left:3px solid var(--rule);padding:4px 0 4px 12px;margin-top:12px}
.enemy b{font-family:var(--f-head)}
.enemy .hint{color:var(--glow);font-size:13.5px}
/* forms */
.card{background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:18px}
.field{margin-top:16px}
.field>label,.field>.lbl{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
.field small{display:block;color:var(--sub);font-weight:400;font-size:12px}
input[type=text],select,textarea{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:9px 10px}
textarea{min-height:84px;resize:vertical}
.stat{display:grid;grid-template-columns:4.5em 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.stat .bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--glow)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:32px;height:32px;border:1px solid var(--rule);background:var(--bg);border-radius:4px;cursor:pointer}
.step button:disabled{opacity:.3;cursor:default}
.step output{width:2em;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.total{display:flex;justify-content:space-between;margin-top:8px;font-size:13.5px;color:var(--sub)}
.total b{font-size:18px;color:var(--warn)}.total b.ok{color:var(--good)}
.choices{display:grid;gap:8px}
@media(min-width:620px){.choices.two{grid-template-columns:1fr 1fr}}
@media(min-width:620px){.choices.three{grid-template-columns:repeat(3,1fr)}}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.choice:has(input:checked){border-color:var(--glow);box-shadow:inset 0 0 0 1px var(--glow)}
.choice:has(input:disabled){opacity:.45;cursor:not-allowed}
.choice input{margin-top:5px;accent-color:var(--glow)}
.choice .t{font-weight:700;display:block}
.choice .d{font-size:12.5px;color:var(--sub);display:block;line-height:1.6}
.choice .c{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--glow);white-space:nowrap;font-weight:700}
.cost{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:18px;padding:12px 14px;border:1px solid var(--rule);border-radius:6px;font-size:14px}
.cost b{font-size:18px}.cost .over{color:var(--bad)}
.btn{display:inline-block;border:0;border-radius:6px;padding:12px 22px;font-weight:700;cursor:pointer;background:var(--glow);color:#0d1015}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%;margin-top:16px;font-size:16px}
.btn.ghost{background:transparent;color:var(--glow);border:1px solid var(--glow)}
.msg{margin-top:12px;font-size:14px;min-height:1.5em}
.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
.me{display:grid;gap:4px 16px;grid-template-columns:auto 1fr;font-size:14px}
.me dt{color:var(--sub)}.me dd{margin:0}
.statline{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--sub)}
.statline b{color:var(--ink)}
.order-now{border-left:3px solid var(--good);padding:6px 0 6px 12px;margin-top:14px;font-size:14px}
.note{color:var(--sub);font-size:12.5px;margin-top:10px}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:40px}
.loading{color:var(--sub)}
/* gate + app shell */
.gate{max-width:440px;margin:0 auto}
.gate .hero{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.gate .card{border-top-left-radius:0;border-top-right-radius:0}
.gate .title{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.gate .title .series{font-family:var(--f-head);font-weight:900;font-size:34px;letter-spacing:.12em;line-height:1.1}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-top:4px}
.seg button{background:transparent;border:0;padding:9px;cursor:pointer;color:var(--sub);font-weight:700}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--glow)}
input[type=email],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:9px 10px}
.bar{display:flex;gap:12px;align-items:center;padding-bottom:12px}
.bar .logo{width:48px;height:48px;border-radius:6px;border:1px solid var(--rule);object-fit:cover;flex:none}
.bar .who{flex:1;min-width:0}
.bar .series{font-family:var(--f-head);font-weight:900;font-size:22px;letter-spacing:.12em;line-height:1.2}
.bar .meta{color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .meta b{color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-bottom:1px solid var(--rule);margin:0 -16px 22px;padding:0 16px}
.tabs a{text-align:center;padding:11px 0 9px;color:var(--sub);text-decoration:none;font-weight:700;font-size:14px;border-bottom:2px solid transparent}
.tabs a[aria-current=page]{color:var(--glow);border-bottom-color:var(--glow)}
.ephead{margin-bottom:18px}
.ephead .ep{font-family:var(--f-head);font-weight:600;font-size:clamp(20px,4.6vw,26px)}
.ephead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--sub);font-size:13px;margin-top:4px}
.ephead .meta b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.kpi small{display:block;color:var(--sub);font-size:11.5px}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.todo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;border:1px solid currentColor}
.pill.ok{color:var(--good)}.pill.ng{color:var(--warn)}
.roster{columns:2 220px;column-gap:24px;font-size:14px;margin:0;padding:0;list-style:none}
.roster li{break-inside:avoid;padding:5px 0;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:8px}
.roster li.me b{color:var(--glow)}
.roster .r{color:var(--sub);font-size:12.5px}
/* results */
.headline{font-size:20px;text-wrap:wrap}
.gauge{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:14px;font-size:13px;color:var(--sub)}
.gbar{position:relative;height:10px;border-radius:5px;background:var(--rule)}
.gbar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--glow)}
.gbar b{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);opacity:.7}
.gv b{color:var(--ink);font-size:16px}
.res{margin-left:auto;font-size:12.5px;font-family:var(--f-body);font-weight:700;border:1px solid currentColor;border-radius:3px;padding:0 8px}
.r-大成功{color:var(--good)}.r-成功{color:var(--glow)}.r-苦戦{color:var(--warn)}.r-失敗{color:var(--bad)}
.out{font-weight:700}.o-good{color:var(--good)}.o-glow{color:var(--glow)}.o-warn{color:var(--warn)}.o-bad{color:var(--bad)}.o-sub{color:var(--sub)}
details summary{cursor:pointer;color:var(--glow);font-size:13.5px;margin-top:8px}
tr.mine td{background:rgba(159,216,234,.08)}
.mvpname{font-family:var(--f-head);font-size:19px}
.rank{margin:0;padding-left:1.8em;font-size:14px}
.rank li{padding:5px 0;border-bottom:1px solid var(--rule)}
.rank li .r{color:var(--sub);font-size:12.5px;margin-left:10px}
.rank li.mine b{color:var(--glow)}
.newtag{display:inline-block;font-size:11px;font-weight:700;color:#0d1015;background:var(--warn);border-radius:3px;padding:0 6px;vertical-align:2px}

/* sortie split view */
.refpane{display:none}
.refbar{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.refbar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--glow);color:var(--glow)}
.refprev{margin-top:30px}.refprev>summary{font-size:14px}
.refbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:99px;padding:12px 20px;font-weight:700;background:var(--warn);color:#0d1015;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer}
.sheet{position:fixed;inset:auto 0 0 0;margin:0;width:100%;max-width:100%;height:88vh;max-height:88vh;padding:0 16px;border:1px solid var(--rule);border-bottom:0;border-radius:14px 14px 0 0;background:var(--bg);color:var(--ink);display:none;flex-direction:column}
.sheet[open]{display:flex;animation:sheetup .22s ease-out}
.sheet::backdrop{background:rgba(0,0,0,.6)}
@keyframes sheetup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheethead{flex:none;border-bottom:1px solid var(--rule)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:8px auto 4px}
.sheetrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .refscroll{flex:1;overflow-y:auto;padding:14px 0 40px;overscroll-behavior:contain}
body.sheet-open{overflow:hidden}
@media(min-width:1100px){
  body.split-on .wrap{max-width:1280px}
  body.split-on .tabs{margin-inline:0}
  .split{display:grid;grid-template-columns:minmax(0,2fr) minmax(360px,1fr);gap:24px;align-items:start}
  body.split-on .ephead{margin-bottom:12px}
  .formpane{position:sticky;top:48px}
  .refpane{display:block;position:sticky;top:48px;height:calc(100vh - 64px);border:1px solid var(--rule);border-radius:8px;background:var(--panel);padding:0 14px;overflow:hidden}
  .refpane .refbar{border-bottom:1px solid var(--rule);position:relative}
  .refpane .refscroll{height:calc(100% - 46px);overflow-y:auto;padding:14px 2px 40px;overscroll-behavior:contain}
  .refpane .refscroll .panel{background:var(--panel2)}
  .formpane{min-width:0}
  .refbtn{display:none}
}

/* compact order card (postcard-style) */
.ocard{background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.oname{font-family:var(--f-head);font-weight:900;font-size:19px;line-height:1.3}
.ohead .statline{font-size:12px}
.ohead .pill{white-space:nowrap;flex:none}
.oflag{margin-top:8px;font-size:12.5px;color:var(--good)}
.orow{display:grid;grid-template-columns:3.6em 1fr;gap:8px;align-items:center;margin-top:10px}
.orow.top{align-items:start}
.olbl{font-weight:700;font-size:13px;color:var(--sub);line-height:1.3}
.olbl small{display:block;font-weight:400;font-size:10.5px}
.orow select{padding:7px 8px;font-size:13.5px}
.ohint{font-size:12px;color:var(--sub);margin:4px 0 0 calc(3.6em + 8px);line-height:1.5}
.ohint b{font-weight:700}
.dl.d-低{color:var(--good)}.dl.d-中{color:var(--glow)}.dl.d-高{color:var(--warn)}.dl.d-最高{color:var(--bad)}
.seg4,.seg3{display:grid;gap:6px}.seg4{grid-template-columns:repeat(4,1fr)}.seg3{grid-template-columns:repeat(3,1fr)}
.segb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:38px;padding:4px 4px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;line-height:1.25;min-width:0}
.segb b{font-family:var(--f-head);font-size:16px}
.segb span{font-size:10.5px;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segb[aria-checked=true]{border-color:var(--glow);box-shadow:inset 0 0 0 1px var(--glow);background:rgba(159,216,234,.08)}
.segb.d-最高 b{color:var(--bad)}.segb.d-高 b{color:var(--warn)}.segb.d-中 b{color:var(--glow)}.segb.d-低 b{color:var(--good)}
.seg3 .segb b{font-family:var(--f-body);font-size:14px}
.eq4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.eq4 select{padding:6px 6px;font-size:12.5px}
.ochk{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.ochk input{accent-color:var(--glow)}
.up5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.upc{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub)}
.upc .step button{width:24px;height:24px}
.upc .step output{width:1.6em;color:var(--ink)}
.ledger{display:flex;justify-content:center;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:12px;padding:8px 10px;border:1px dashed var(--rule);border-radius:6px;font-size:13px;color:var(--sub)}
.ledger b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.ledger b.ok{color:var(--good)}.ledger b.over{color:var(--bad)}
.ocard .btn.full{margin-top:10px;padding:10px}
.ocard .msg{margin-top:6px;min-height:1.2em;font-size:13px}

.ostats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:10px}
.ostats .sc{display:flex;flex-direction:column;align-items:center;padding:4px 0;border:1px solid var(--rule);border-radius:6px;background:var(--bg);min-width:0}
.ostats .sn{font-size:11px;color:var(--sub)}
.ostats .sv{display:flex;align-items:center;gap:2px}
.ostats .sv b{min-width:1.4em;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.ostats .sv button{width:20px;height:20px;padding:0;line-height:1;border:1px solid var(--rule);border-radius:4px;background:transparent;color:var(--ink);cursor:pointer;font-size:13px}
.ostats:not(.on) .sv button{opacity:.15;cursor:default}
.ostats.on .sv button:disabled{opacity:.3;cursor:default}
.ostats.on .sc{border-color:rgba(159,216,234,.45)}
.ostats .sc.raised b{color:var(--good)}
.opromo{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 10px;margin-top:6px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.opromo .ochk{font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <!-- Before login: the gate. After login: app bar + tabs + one view at a time -->
  <div id="gate" hidden></div>
  <div id="app" hidden>
    <header class="bar">
      <img class="logo" id="logo" alt="">

const whaleImg = n => /大型/.test(n)?IMG.whale_big:/小型/.test(n)?IMG.whale_small:IMG.whale_unknown;
const imgSrc = (v, fallback) => v && /^(https:|data:image\/|img\/[\w.-]+$)/.test(v) ? v : fallback;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let sb, session = null, ep = null, last = null, gauge = null, epNo = {}, me = null, myOrder = null, roster = [], myResults = [];
const AUTH_JA = m => /Invalid login credentials/i.test(m) ? 'メールアドレスかパスワードが違います。'
  : /already registered|already been registered/i.test(m) ? 'このメールアドレスは登録済みです。「ログイン」から入ってください。'
  : /Password should be at least/i.test(m) ? 'パスワードは6文字以上にしてください。'
  : /valid email|invalid format/i.test(m) ? 'メールアドレスの形が正しくありません。'
  : /rate limit|too many/i.test(m) ? '試行回数が多すぎます。少し待ってからもう一度どうぞ。'
  : m;

async function boot(){
  $('#boot').hidden = true;
  if (!window.supabase){ $('#gate').hidden=false; $('#gate').innerHTML = '<p class="msg err">接続用の部品を読み込めませんでした。通信状況を確認して、ページを再読み込みしてください。</p>'; return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  ({ data: { session } } = await sb.auth.getSession());
  if (session) await enterApp(); else renderGate();
}

/* ---------- gate (login / sign-up) ---------- */
function renderGate(){
  $('#app').hidden = true; const g = $('#gate'); g.hidden = false;
  let mode = 'login';
  g.innerHTML = `<div class="gate">
    <div class="title"><img class="logo" src="${IMG.logo}" alt="" style="width:64px;height:64px;border-radius:6px;border:1px solid var(--rule)"><div><div class="series">星海戦記</div><div style="color:var(--sub);font-size:13px">読者参加型 宇宙艦隊戦記</div></div></div>
    <img class="hero" src="${IMG.hero}" alt="クジラ型艦と交戦する宙航軍の艦隊">
    <form class="card" id="authForm" novalidate>
      <div class="seg" role="group" aria-label="ログインか新規登録か"><button type="button" data-m="login" aria-pressed="true">ログイン</button><button type="button" data-m="signup" aria-pressed="false">新規登録</button></div>
      <div class="field"><label for="aEmail">メールアドレス</label><input type="email" id="aEmail" autocomplete="email" required></div>
      <div class="field"><label for="aPass">パスワード<small id="aPassHint"></small></label><input type="password" id="aPass" autocomplete="current-password" minlength="6" required></div>
      <div class="field" id="aPass2Wrap" hidden><label for="aPass2">パスワード（確認）</label><input type="password" id="aPass2" autocomplete="new-password"></div>
      <button class="btn full" id="aBtn" type="submit">ログイン</button>
      <div class="msg" id="aMsg" role="status"></div>
    </form></div>`;
  const setMode = m => { mode = m;
    g.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.m===m));
    $('#aPass2Wrap').hidden = m!=='signup'; $('#aBtn').textContent = m==='signup'?'登録して入隊する':'ログイン';
    $('#aPass').autocomplete = m==='signup'?'new-password':'current-password';
    $('#aPassHint').textContent = m==='signup'?'6文字以上':''; $('#aMsg').textContent=''; };
  g.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const msg = $('#aMsg'); msg.className = 'msg err';
    const email = $('#aEmail').value.trim(), pass = $('#aPass').value;
    if (!email || !pass){ msg.textContent = 'メールアドレスとパスワードを入れてください。'; return; }
    if (mode==='signup'){
      if (pass.length < 6){ msg.textContent = 'パスワードは6文字以上にしてください。'; return; }
      if (pass !== $('#aPass2').value){ msg.textContent = '確認用のパスワードが一致しません。'; return; }
    }
    $('#aBtn').disabled = true; msg.className='msg'; msg.textContent = mode==='signup'?'登録しています…':'ログインしています…';
    const { data, error } = mode==='signup' ? await sb.auth.signUp({ email, password: pass }) : await sb.auth.signInWithPassword({ email, password: pass });
    $('#aBtn').disabled = false;
    if (error){ msg.className='msg err'; msg.textContent = AUTH_JA(error.message); return; }
    if (!data.session){ msg.className='msg ok'; msg.textContent = '確認メールを送りました。メール内のリンクを開いてから、ログインしてください。'; setMode('login'); return; }
    session = data.session; await enterApp();
  };
}

/* ---------- app (after login) ---------- */
async function enterApp(){
  $('#gate').hidden = true; $('#gate').innerHTML = ''; $('#app').hidden = false;
  $('#logo').src = IMG.logo;
  $('#logout').onclick = async () => { await sb.auth.signOut(); session = null; me = null; location.hash = ''; renderGate(); };
  await loadAll();
}

async function loadAll(){
  const { data: e, error } = await sb.from('episodes').select('id,no,title,status,deadline,content').eq('status','open').order('no',{ascending:false}).limit(1).maybeSingle();
  if (error){ $('#view').innerHTML = `<p class="msg err">紙面を読み込めませんでした（${esc(error.message)}）。</p>`; return; }
  ep = e;
  const [lr, er] = await Promise.all([
    sb.from('episodes').select('id,no,title,content,report').eq('status','done').order('no',{ascending:false}).limit(1).maybeSingle(),
    sb.from('episodes').select('id,no').neq('status','draft')]);
  last = lr.data || null;
  epNo = Object.fromEntries((er.data||[]).map(x=>[x.id,x.no]));
  const r = await sb.from('characters').select('id,name,rank,state').order('id');
  roster = r.data || [];
  me = null; myOrder = null; myResults = [];
  const m = await sb.from('characters').select('*').eq('user_id', session.user.id).maybeSingle();
  me = m.data;
  if (me){
    if (ep){ const o = await sb.from('orders').select('*').eq('episode_id', ep.id).eq('character_id', me.id).maybeSingle(); myOrder = o.data; }
    const rs = await sb.from('results').select('episode_id,area,ship_code,outcome,merit_gained,kills,highlight').eq('character_id', me.id).order('episode_id',{ascending:false});
    myResults = rs.data || [];
  }
  renderWho(); route();
}

function renderWho(){
  $('#who').innerHTML = me ? `<b>${esc(me.rank)}　${esc(me.name)}</b>　功績P <b>${me.merit}</b>` : esc(session.user.email || 'ログイン中');
}
function dlText(){ return ep?.deadline ? new Date(ep.deadline).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}) : '未定'; }
function epHead(){
  return ep ? `<div class="ephead"><div class="ep">第${ep.no}話　${esc(ep.title)}</div><div class="meta"><span>舞台 <b>${esc(ep.content.place||'')}</b></span><span>出撃締切 <b>${esc(dlText())}</b></span><span>登録艦長 <b>${roster.length}名</b></span></div></div>` : '';
}

function mapSvg(areas){
  // Background art per episode (content.map_image), area pins laid over it in % so labels stay readable at any width
  const c = ep.content;
  const src = c.map_image, srcS = c.map_image_s || c.map_image;
  const pos = c.map_pos || {A:[22,30],B:[83,36],C:[17,68],D:[83,70]};
  const pins = areas.filter(a=>pos[a.code]).map(a=>{ const [x,y]=pos[a.code];
    const side = x < 50 ? `left:${Math.max(1.5, x-12)}%` : `right:${Math.max(1.5, 100-x-12)}%`;
    return `<div class="pin d-${esc(a.danger)}" style="${side};top:${y}%"><b>${esc(a.code)}</b><span>${esc(a.name)}</span></div>`; }).join('');
  return `<figure class="map" role="img" aria-label="${esc(c.place)}の戦略マップ。${areas.map(a=>a.code+' '+a.name).join('、')}">
    ${src ? `<img src="${esc(src)}" srcset="${esc(srcS)} 800w, ${esc(src)} 1600w" sizes="(max-width:760px) 100vw, 760px" alt="" width="1600" height="899" loading="lazy">`
      : `<svg viewBox="0 0 1600 899" aria-hidden="true" style="display:block;width:100%;height:auto"><rect width="1600" height="899" fill="#05070a"/>${Array.from({length:90},(_,i)=>`<circle cx="${(i*379)%1600}" cy="${(i*211)%899}" r="${1+(i%3)*.8}" fill="#9aa4b2" opacity="${.25+(i%4)*.15}"/>`).join('')}<ellipse cx="800" cy="450" rx="560" ry="250" fill="none" stroke="#3a4554" stroke-width="2"/><ellipse cx="800" cy="450" rx="330" ry="140" fill="none" stroke="#3a4554" stroke-width="2"/><circle cx="800" cy="450" r="92" fill="#1a212b" stroke="#97a2b1" stroke-width="3"/><ellipse cx="800" cy="450" rx="160" ry="30" fill="none" stroke="#97a2b1" stroke-width="3"/></svg>`}
    ${pins}<figcaption>${esc(c.place||'')}</figcaption></figure>`;
}

function renderPaper(box, ref = false){
  if (!ep){ box.innerHTML = '<p class="note">次の作戦の発表をお待ちください。</p>'; return; }
  const c = ep.content;
  const areas = c.areas.map(a=>`<article class="area"><h3><span class="code">${esc(a.code)}</span>${esc(a.name)}</h3>
     <div class="tags"><span class="tag d-${esc(a.danger)}">危険度 ${esc(a.danger)}</span><span class="tag">推奨能力 ${a.rec.map(k=>esc(SNAME[k])).join('・')}</span><span class="tag">有効な装備 ${a.eq.map(esc).join('・')}</span>${a.main?'<span class="tag">主戦場</span>':''}</div>
     <p>${esc(a.desc)}</p></article>`).join('');
  const ships = c.ships.map(s=>`<tr><td>${(s.img||IMG[s.code])?`<img class="shipimg" src="${imgSrc(s.img,IMG[s.code])}" alt="${esc(s.name)}">`:''}<b>${esc(s.name)}</b>${s.new?' <span class="newtag">新型</span>':''}<br><span class="note" style="margin:0">${esc(s.class)}　${esc(s.desc)}</span></td><td class="num">${esc(s.atk)}</td><td class="num">${esc(s.def)}</td><td class="num">${esc(s.mob)}</td><td class="num">${esc(s.cost)}</td></tr>`).join('');
  const eqs = c.equipment.map(q=>`<tr><td><b>${esc(q.name)}</b>${q.new?' <span class="newtag">新装備</span>':''}<br><span class="note" style="margin:0">${esc(q.desc)}</span></td><td class="num">${esc(q.type)}</td><td class="num">${esc(q.cost)}</td></tr>`).join('');
  const enemies = (c.enemies||[]).map(x=>`<div class="enemy"><img src="${imgSrc(x.img,whaleImg(x.name))}" alt="${esc(x.name)}"><div><b>${esc(x.name)}</b>${x.new?' <span class="newtag">新型</span>':''}<p style="margin:2px 0">${esc(x.desc)}</p><p class="hint" style="margin:0">${esc(x.hint||'')}</p></div></div>`).join('') + (c.unknown_teaser!==false?`<div class="enemy"><img src="${IMG.whale_unknown}" alt="未確認艦のシルエット"><div><b>未確認艦</b><p style="margin:2px 0">交戦宙域の奥で、正体不明の大型反応が確認されている。</p></div></div>`:'');
  const current = `
    <img class="hero" src="${imgSrc(c.hero,IMG.hero)}" alt="クジラ型艦と交戦する宙航軍の艦隊">
    <div class="sh">導入</div>
    <div class="panel"><p class="intro" style="margin:0">${esc(c.intro)}</p>
      ${c.briefing?`<div class="brief"><img class="face" src="${IMG.iruka}" alt="イルカ中尉"><div><b style="color:var(--ink)">イルカ中尉</b><br>${esc(c.briefing)}</div></div>`:''}</div>
    <section data-sec="map"><div class="sh">戦略マップ</div>${mapSvg(c.areas)}</section>
    <section data-sec="areas"><div class="sh">出撃エリア</div><div class="areas">${areas}</div></section>
    <section data-sec="ships"><div class="sh">艦艇</div><div class="tbl"><table><thead><tr><th>艦</th><th class="num">攻撃</th><th class="num">防御</th><th class="num">機動</th><th class="num">功績P</th></tr></thead><tbody>${ships}</tbody></table></div></section>
    <section data-sec="eq"><div class="sh">装備（1隻4つまで）</div><div class="tbl"><table><thead><tr><th>装備</th><th class="num">種別</th><th class="num">功績P</th></tr></thead><tbody>${eqs}</tbody></table></div></section>
    <section data-sec="enemy"><div class="sh">敵艦情報</div>${enemies}</section>`;
  if (ref){
    const rpt = renderReport();
    box.innerHTML = current + (rpt ? `<details class="refprev" data-sec="prev"><summary>前回の結果を見る</summary>${rpt}</details>` : '');
  } else {
    box.innerHTML = epHead() + renderReport() + (last?'<div class="sh" style="margin-top:34px">今回の作戦</div>':'') + current;
  }
}


/* ---------- sortie view: paper beside the form ----------
   Wide screens (>=1100px): two panes, paper left / form right, each scrolls on its own (the usual "reference + form" split).
   Phones & narrow windows: the form fills the screen; a floating 「紙面を見る」 button opens the paper as a bottom sheet
   with jump chips, and closing it returns to the form exactly where you were. */
const WIDE = window.matchMedia('(min-width:1100px)');
const REF_CHIPS = [['areas','エリア'],['ships','艦艇'],['eq','装備'],['enemy','敵艦'],['map','マップ'],['prev','前回']];
function chipsHtml(){ return REF_CHIPS.map(([k,n])=>`<button type="button" class="chip" data-jump="${k}">${n}</button>`).join(''); }
function bindChips(scope, pane){
  scope.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{
    const t = pane.querySelector(`[data-sec="${b.dataset.jump}"]`); if (!t) return;
    if (t.tagName==='DETAILS') t.open = true;
    pane.scrollTo({ top: t.offsetTop - pane.offsetTop - 8, behavior: 'smooth' });
  });
}
function renderSortieView(box){
  box.innerHTML = epHead() + `<div class="split">
      <aside class="refpane" aria-label="紙面"><div class="refbar">${chipsHtml()}</div><div class="refscroll" id="refPane"></div></aside>
      <div class="formpane"><div id="sbox"></div></div>
    </div>
    <button type="button" class="refbtn" id="refBtn" aria-haspopup="dialog">紙面を見る</button>
    <dialog class="sheet" id="refSheet" aria-label="紙面">
      <div class="sheethead"><div class="grab" aria-hidden="true"></div><div class="sheetrow"><b>第${ep.no}話の紙面</b><button type="button" class="btn ghost sm" id="refClose">閉じて入力に戻る</button></div><div class="refbar">${chipsHtml()}</div></div>
      <div class="refscroll" id="refSheetBody"></div>
    </dialog>`;
  renderSortie($('#sbox'));
  const pane = $('#refPane'), sheet = $('#refSheet'), body = $('#refSheetBody');
  const fillPane = () => { if (WIDE.matches && !pane.childElementCount){ renderPaper(pane, true); bindChips(pane.parentElement, pane); } };
  fillPane(); WIDE.onchange = () => { if ($('#refPane')) fillPane(); };
  $('#refBtn').onclick = () => {
    if (!body.childElementCount){ renderPaper(body, true); bindChips(sheet, body); }
    sheet.showModal(); document.body.classList.add('sheet-open');
  };
  const close = () => { sheet.close(); };
  $('#refClose').onclick = close;
  sheet.addEventListener('close', () => document.body.classList.remove('sheet-open'));
  sheet.addEventListener('click', e => { if (e.target === sheet) close(); });   // tap the dimmed area to close
}

/* ---------- router ---------- */
const VIEWS = ['home','paper','sortie','roster'];
function route(){
  let v = location.hash.slice(1); if (!VIEWS.includes(v)) v = 'home';
  document.querySelectorAll('#tabs a').forEach(a=> a.dataset.v===v ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  const box = $('#view');
  if (!me && v!=='paper' && v!=='roster'){ renderRegister(box); return; }
  document.body.classList.toggle('split-on', v==='sortie' && !!ep && !!me);
  if (v==='home') renderHome(box);
  else if (v==='paper') renderPaper(box);
  else if (v==='sortie'){ if (!ep){ box.innerHTML = '<p class="note">現在、受付中の作戦はありません。</p>'; return; } renderSortieView(box); }
  else renderRoster(box);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', () => { if (session && !$('#app').hidden) route(); });

/* ---------- home (司令部) ---------- */
function renderHome(box){
  const c = ep?.content;
  const shipName = code => c?.ships.find(s=>s.code===code)?.name || code || 'なし';
  const areaName = code => c?.areas.find(a=>a.code===code)?.name || '';
  const STATE = {active:'出撃可能',missing:'消息不明（次回は出撃不可）',lost:'戦没',retired:'退役'};
  const o = myOrder;
  box.innerHTML = `
    <div class="card"><div class="todo"><h2 style="font-size:22px">${esc(me.rank)}　${esc(me.name)}</h2><span class="pill ${me.state==='active'&&!me.injured?'ok':'ng'}">${me.injured?'負傷中':(STATE[me.state]||me.state)}</span></div>
      ${me.injured?'<p class="note" style="margin:6px 0 0;color:var(--warn)">前回の戦闘で負傷しました。次の戦闘では全能力値が1下がります。戦闘が終われば回復します。</p>':''}
      <div class="kpis"><div class="kpi"><small>功績P</small><b>${me.merit}</b></div><div class="kpi"><small>乗艦</small><b style="font-size:15px">${esc(shipName(me.ship_code))}</b></div><div class="kpi"><small>出撃回数</small><b>${myResults.filter(r=>r.outcome!=='未出撃').length}</b></div></div>
      <div class="statline" style="margin-top:10px">${STATS.map(([k,n])=>`<span>${n} <b>${me.stats[k]}</b></span>`).join('')}</div></div>
    ${ep?`<section><div class="sh">今回の作戦</div><div class="panel">
      <div class="todo"><div><b style="font-family:var(--f-head);font-size:17px">第${ep.no}話　${esc(ep.title)}</b><div class="note" style="margin:0">出撃締切 ${esc(dlText())}</div></div>
      ${o?'<span class="pill ok">出撃指示 提出済み</span>':'<span class="pill ng">出撃指示 未提出</span>'}</div>
      ${o?`<p style="margin:10px 0 0;font-size:14px">${esc(o.area)} ${esc(areaName(o.area))}／${esc(shipName(o.ship_code))}／方針 ${esc(o.stance||'標準')}${o.equipment?.length?'／装備 '+o.equipment.length+'個':''}</p>`:''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><a class="btn" href="#sortie" style="text-decoration:none">${o?'出撃指示を見直す':'出撃指示を出す'}</a><a class="btn ghost" href="#paper" style="text-decoration:none">紙面を読む</a></div>
    </div></section>`:'<section><p class="note">現在、受付中の作戦はありません。</p></section>'}
    <section><div class="sh">戦績</div>${myResults.length?`<div class="tbl"><table><thead><tr><th>話</th><th>エリア</th><th>結果</th><th class="num">撃沈</th><th class="num">功績P</th></tr></thead><tbody>${myResults.map(r=>`<tr><td>第${epNo[r.episode_id]??'?'}話</td><td>${esc(r.area||'')}</td><td>${esc(r.outcome)}${r.highlight?`<br><span class="note" style="margin:0">${esc(r.highlight)}</span>`:''}</td><td class="num">${r.kills}</td><td class="num">+${r.merit_gained}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note" style="margin:0">まだ戦績はありません。最初の作戦の結果が出ると、ここに載ります。</p>'}</section>`;
}

/* ---------- roster (名簿) ---------- */
function renderRoster(box){
  box.innerHTML = `<div class="sh">艦長名簿　${roster.length}名</div><ul class="roster">${roster.map(r=>`<li class="${me&&r.id===me.id?'me':''}"><b>${esc(r.name)}</b><span class="r">${esc(r.rank)}${r.state!=='active'?'・'+({missing:'消息不明',lost:'戦没',retired:'退役'}[r.state]||''):''}</span></li>`).join('')}</ul>`;
}

/* ---------- previous episode results (紙面の冒頭) ---------- */
const OUT_CLS = {'帰還':'good','損傷':'glow','大破':'warn','撃沈':'bad','消息不明':'bad','未出撃':'sub'};
function renderReport(){
  const rp = last?.report; if (!rp || !rp.judge) return '';
  const areas = rp.judge.areas || [], ent = rp.entries || [], byId = Object.fromEntries(ent.map(x=>[x.id,x]));
  const g0 = rp.judge.gauge_before, g1 = rp.judge.gauge_after;
  const lc = last.content || {}, aname = c => (lc.areas||[]).find(a=>a.code===c)?.name || '';
  const row = x => `<tr class="${me&&x.id===me.id?'mine':''}"><td><b>${esc(x.name)}</b> <span class="note" style="margin:0">${esc(x.rank)}</span></td><td>${esc(x.ship)}</td><td><span class="out o-${OUT_CLS[x.outcome]||'sub'}">${esc(x.outcome)}${x.outcome==='撃沈'?(x.injured?'・負傷して脱出':'・無傷で脱出'):''}</span></td><td class="num">${x.kills}</td><td class="num">+${x.merit}</td></tr>`;
  const mine = me && byId[me.id];
  return `<section class="report" style="margin-top:0"><div class="sh">前回の結果　第${last.no}話「${esc(last.title)}」</div>
    <div class="panel">
      <h3 class="headline">${esc(rp.headline||'')}</h3>
      <p style="margin:8px 0 0">${esc(rp.summary||'')}</p>
      ${g0!=null?`<div class="gauge" role="img" aria-label="戦況ゲージ ${g0}から${g1}"><span class="gl">戦況</span><div class="gbar"><i style="width:${g1}%"></i><b style="left:${g0}%"></b></div><span class="gv">${g0} → <b>${g1}</b></span></div>
      <div class="note" style="margin-top:2px">右へ伸びるほど航宙軍が優勢。最終話の結末を左右します</div>`:''}
      ${mine?`<div class="order-now">あなたの結果：${esc(mine.area||'')} ${esc(aname(mine.area))}／<span class="out o-${OUT_CLS[mine.outcome]||'sub'}">${esc(mine.outcome)}</span>　撃沈 ${mine.kills}　功績P +${mine.merit}</div>`:''}
    </div>
    <div class="areas" style="margin-top:12px">${areas.map(a=>{ const list = ent.filter(x=>x.area===a.code);
      return `<article class="area"><h3><span class="code">${esc(a.code)}</span>${esc(a.name)}<span class="res r-${esc(a.result)}">${esc(a.result)}</span></h3>
      <p>${esc(rp.area_text?.[a.code]||'')}</p>
      ${list.length?`<details><summary>戦闘記録（${list.length}名）</summary><div class="tbl" style="margin-top:8px"><table><thead><tr><th>艦長</th><th>艦</th><th>結果</th><th class="num">撃沈</th><th class="num">功績P</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div></details>`:''}</article>`; }).join('')}</div>
    ${rp.mvp?`<div class="panel mvp" style="margin-top:12px"><div class="sh" style="margin:0 0 4px">最活躍</div><b class="mvpname">${esc(rp.mvp.rank)}　${esc(rp.mvp.name)}</b><p style="margin:4px 0 0;font-size:14px">${esc(rp.mvp.text)}</p></div>`:''}
    ${(rp.ranking||[]).length?`<div class="sh" style="margin-top:22px">活躍ランキング</div><ol class="rank">${rp.ranking.map(id=>byId[id]).filter(Boolean).map(x=>`<li class="${me&&x.id===me.id?'mine':''}"><b>${esc(x.name)}</b><span class="r">${esc(x.area)} ${esc(aname(x.area))}　撃沈${x.kills}　+${x.merit}P</span></li>`).join('')}</ol>`:''}
  </section>`;
}

/* ---------- paper (紙面) ---------- */
/* ---------- registration ---------- */
function renderRegister(box){
  const st = {attack:5,helm:5,command:5,engineering:5,intuition:5};
  box.innerHTML = `<div class="sh">キャラクター登録</div><div class="card">
    <h2 style="font-size:20px">士官登録</h2>
    <div class="field"><label for="rName">名前<small>全角カタカナ10文字まで。「・」「＝」も使えます</small></label><input type="text" id="rName" maxlength="10" placeholder="例）アルト＝カミナギ"></div>
    <div class="field"><span class="lbl">性別</span><div class="choices two" style="grid-template-columns:repeat(3,1fr)">${['男','女','その他'].map((g,i)=>`<label class="choice"><input type="radio" name="rGender" value="${g}" ${i===0?'checked':''}><span class="t">${g}</span></label>`).join('')}</div></div>
    <div class="field"><label for="rLook">外見（任意）<small>300文字まで。挿絵を作るときの参考にします</small></label><textarea id="rLook" maxlength="300"></textarea></div>
    <div class="field"><span class="lbl">能力値<small>合計25、各0〜10</small></span><div id="rStats"></div><div class="total"><span>合計</span><b id="rTotal">25 / 25</b></div></div>
    <div class="field"><label class="choice"><input type="checkbox" id="rPortrait" checked><span><span class="t">肖像を描いてよい</span><span class="d">活躍したとき、紙面にAIで描いた肖像が載ることがあります</span></span></label></div>
    <button class="btn full" id="rBtn">登録する</button><div class="msg" id="rMsg" role="status"></div></div>`;
  const draw = () => {
    const total = Object.values(st).reduce((a,b)=>a+b,0);
    $('#rStats').innerHTML = STATS.map(([k,n,d])=>`<div class="stat"><div><b>${n}</b><br><small style="color:var(--sub);font-size:11px">${d}</small></div><div class="bar"><i style="width:${st[k]*10}%"></i></div>
      <div class="step"><button type="button" data-k="${k}" data-d="-1" aria-label="${n}を下げる" ${st[k]<=0?'disabled':''}>−</button><output>${st[k]}</output><button type="button" data-k="${k}" data-d="1" aria-label="${n}を上げる" ${st[k]>=10||total>=25?'disabled':''}>＋</button></div></div>`).join('');
    $('#rTotal').textContent = `${total} / 25`; $('#rTotal').className = total===25?'ok':'';
    $('#rStats').querySelectorAll('button').forEach(b=>b.onclick=()=>{ st[b.dataset.k]+= +b.dataset.d; draw(); });
  };
  draw();
  $('#rBtn').onclick = async () => {
    const msg = $('#rMsg'); msg.className='msg';
    const total = Object.values(st).reduce((a,b)=>a+b,0);
    if (total !== 25){ msg.className='msg err'; msg.textContent='能力値の合計を25にしてください。'; return; }
    $('#rBtn').disabled = true; msg.textContent = '登録しています…';
    const { error } = await sb.rpc('create_character', { p_name: $('#rName').value.trim(), p_gender: document.querySelector('input[name=rGender]:checked').value, p_appearance: $('#rLook').value, p_stats: st, p_portrait_ok: $('#rPortrait').checked });
    if (error){ msg.className='msg err'; msg.textContent = error.message; $('#rBtn').disabled=false; return; }
    await loadAll();
  };
}

/* ---------- sortie (compact order card) ----------
   Modeled on the old postcard order form: one card, one screen. Everything you need to *read* is in the paper on the left;
   here you only pick: area / ship / equipment (4 slots) / stance / wingman / promotion, and see the merit ledger. */
function renderSortie(box){
  const c = ep.content;
  const shipOf = code => c.ships.find(s=>s.code===code);
  const eqOf = code => c.equipment.find(q=>q.code===code);
  const o = myOrder;
  const initEq = (o?.equipment || me.equipment || []).slice(0,4);
  const state = { area: o?.area || '', ship: o?.ship_code || me.ship_code || '', eq: [0,1,2,3].map(i=>initEq[i]||''),
    promote: !!o?.promote, up: {...(o?.stat_up||{})}, stance: o?.stance || '標準', wing: o?.wingman_id ? String(o.wingman_id) : '' };
  const missing = me.state === 'missing';
  const canPromote = ep.no > (me.joined_no ?? 1);
  if (!canPromote){ state.promote = false; state.up = {}; }
  const nextRank = RANKS[RANKS.indexOf(me.rank)+1];

  box.innerHTML = `<form class="ocard" id="sortie" novalidate>
    <div class="ohead">
      <div class="oname">${esc(me.rank)}　${esc(me.name)}</div>
      ${me.injured?'<span class="pill ng" title="今回の戦闘では全能力値が1下がります">負傷中 能力−1</span>':''}
    </div>
    <div class="ostats" id="sStats"></div>
    <div class="opromo">
      <label class="ochk"><input type="checkbox" id="sPromote" ${!canPromote||!nextRank?'disabled':''}> ${nextRank?`昇進する　${esc(me.rank)}→${esc(nextRank)}（${RANK_COST[me.rank]}P）`:'これ以上昇進できません'}</label>
      <span class="ohint" id="sUpHint" style="margin:0"></span>
    </div>
    ${missing?'<p class="msg err" style="margin:6px 0 0">前回消息不明のため、今回は出撃できません。</p>':''}
    ${o?`<div class="oflag">第${ep.no}話の出撃指示を受付済み。締切までは何度でも出し直せます。</div>`:''}

    <div class="orow"><span class="olbl">部隊</span><div class="seg4" id="sArea" role="radiogroup" aria-label="出撃エリア"></div></div>
    <div class="ohint" id="sAreaHint"></div>

    <div class="orow"><label class="olbl" for="sShip">艦艇</label><select id="sShip"></select></div>
    <div class="orow top"><span class="olbl">装備<small>4つまで</small></span><div class="eq4" id="sEq"></div></div>

    <div class="orow"><span class="olbl">方針</span><div class="seg3" id="sStance" role="radiogroup" aria-label="作戦方針"></div></div>

    <div class="ledger" id="sCost" aria-live="polite"></div>
    <button class="btn full" id="sBtn" ${missing?'disabled':''}>${o?'出撃指示を出し直す':'出撃する'}</button>
    <div class="msg" id="sMsg" role="status"></div>
  </form>`;

  $('#sPromote').checked = state.promote;

  const rankIdx = () => RANKS.indexOf(me.rank) + (state.promote?1:0);
  const statsAfter = () => { const s={...me.stats}; if(state.promote) for(const k in state.up) s[k]+=state.up[k]; return s; };
  const shipNg = s => { const r=s.requires||{}; if(r.rank && rankIdx() < RANKS.indexOf(r.rank)) return `${r.rank}以上`; if(r.stats){ const sa=statsAfter(); for(const k in r.stats) if((sa[k]||0) < r.stats[k]) return `${SNAME[k]}${r.stats[k]}以上`; } return ''; };
  const shipCost = s => me.ship_code===s.code ? (me.repair_due||0) : (s.free_from && me.ship_code===s.free_from ? 0 : s.cost);
  const calc = () => {
    let cost = state.promote ? (RANK_COST[me.rank]||0) : 0;
    const s = shipOf(state.ship); if (s) cost += shipCost(s);
    for (const code of state.eq) if (code && !me.equipment.includes(code)) cost += eqOf(code)?.cost || 0;
    return cost;
  };
  const draw = () => {
    $('#sArea').innerHTML = c.areas.map(a=>`<button type="button" role="radio" aria-checked="${state.area===a.code}" class="segb d-${esc(a.danger)}" data-v="${a.code}" title="${esc(a.name)}"><b>${esc(a.code)}</b><span>${esc(a.name)}</span></button>`).join('');
    const ar = c.areas.find(a=>a.code===state.area);
    $('#sAreaHint').innerHTML = ar ? `危険度 <b class="dl d-${esc(ar.danger)}">${esc(ar.danger)}</b>　推奨 ${ar.rec.map(k=>SNAME[k]).join('・')}　有効 ${ar.eq.join('・')}` : '部隊を選ぶと、その宙域の要点がここに出ます';
    $('#sShip').innerHTML = `<option value="">選んでください</option>` + c.ships.map(s=>{ const ng=shipNg(s); const owned=me.ship_code===s.code; const free=s.free_from && me.ship_code===s.free_from;
      return `<option value="${s.code}" ${ng?'disabled':''}>${esc(s.name)}　攻${s.atk}防${s.def}機${s.mob}　${owned?(me.repair_due?`乗艦中・修理${me.repair_due}P`:'乗艦中'):free?'無料改修':s.cost+'P'}${ng?`（${ng}）`:''}</option>`; }).join('');
    $('#sShip').value = state.ship && !shipNg(shipOf(state.ship)||{}) ? state.ship : (state.ship='', '');
    $('#sEq').innerHTML = state.eq.map((v,i)=>`<select data-i="${i}" aria-label="装備${i+1}"><option value="">― なし ―</option>${c.equipment.map(q=>{ const taken = state.eq.includes(q.code) && v!==q.code;
      return `<option value="${q.code}" ${taken?'disabled':''} ${v===q.code?'selected':''}>${esc(q.name)}［${esc(q.type)}］${me.equipment.includes(q.code)?'所持':q.cost+'P'}</option>`; }).join('')}</select>`).join('');
    $('#sStance').innerHTML = STANCES.map(([k,d])=>`<button type="button" role="radio" aria-checked="${state.stance===k}" class="segb" data-v="${k}" title="${esc(d)}"><b>${k}</b></button>`).join('');
    const upTotal = Object.values(state.up).reduce((a,b)=>a+b,0);
    // stats are always shown; the +/- only light up while 「昇進する」 is checked
    const on = state.promote;
    $('#sStats').className = 'ostats' + (on ? ' on' : '');
    $('#sStats').innerHTML = STATS.map(([k,n])=>{ const v = me.stats[k]+(state.up[k]||0);
      return `<div class="sc${state.up[k]?' raised':''}"><span class="sn">${n}</span><div class="sv"><button type="button" data-k="${k}" data-d="-1" aria-label="${n}を下げる" ${!on||!(state.up[k]>0)?'disabled':''}>−</button><b>${v}</b><button type="button" data-k="${k}" data-d="1" aria-label="${n}を上げる" ${!on||upTotal>=2||v>=20?'disabled':''}>＋</button></div></div>`; }).join('');
    $('#sUpHint').textContent = !canPromote ? '参加した回の次の回から昇進できます' : on ? `あと ${2-upTotal} 上げられます` : '昇進すると能力値を合計2上げられます';
    const cost = calc(), left = me.merit - cost;
    $('#sCost').innerHTML = `<span>所持 <b>${me.merit}</b></span><span>−</span><span>消費 <b>${cost}</b></span><span>＝</span><span>残り <b class="${left<0?'over':'ok'}">${left}</b> P</span>`;
    bind();
  };
  const bind = () => {
    $('#sArea').querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.area=b.dataset.v; draw(); });
    $('#sStance').querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.stance=b.dataset.v; draw(); });
    $('#sShip').onchange = e => { state.ship = e.target.value; draw(); };
    $('#sEq').querySelectorAll('select').forEach(s=>s.onchange=()=>{ state.eq[+s.dataset.i] = s.value; draw(); });
    $('#sStats').querySelectorAll('button').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; state.up[k]=(state.up[k]||0)+(+b.dataset.d); if(!state.up[k]) delete state.up[k]; draw(); });
  };
  $('#sPromote').onchange = e => { state.promote = e.target.checked; if(!state.promote) state.up = {}; draw(); };
  draw();

  $('#sortie').onsubmit = async ev => {
    ev.preventDefault();
    const msg = $('#sMsg'); msg.className = 'msg err';
    if (!state.area){ msg.textContent='部隊（出撃エリア）を選んでください。'; return; }
    if (!state.ship){ msg.textContent='艦艇を選んでください。'; return; }
    if (state.promote && Object.values(state.up).reduce((a,b)=>a+b,0) !== 2){ msg.textContent='昇進するときは能力値を合計2上げてください。'; return; }
    if (calc() > me.merit){ msg.textContent='功績Pが足りません。艦や装備を見直してください。'; return; }
    $('#sBtn').disabled = true; msg.className='msg'; msg.textContent = '送信しています…';
    const eq = [...new Set(state.eq.filter(Boolean))];
    const { data, error } = await sb.rpc('submit_order', { p_area: state.area, p_ship: state.ship, p_equipment: eq, p_wingman: null, p_promote: state.promote, p_stat_up: state.promote ? state.up : {}, p_free_action: '', p_stance: state.stance });
    if (error){ msg.className='msg err'; msg.textContent = error.message; $('#sBtn').disabled=false; return; }
    await loadAll();
    const m = $('#sMsg'); if (m){ m.className='msg ok'; m.textContent = `受け付けました。消費 ${data.cost}P、残り ${data.merit_left}P。締切までは何度でも出し直せます。`; }
  };
}

boot();
</script>
</body>
</html>
